<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Deluxe Seat — Accounts</title>
<style>
  :root{
    --bg:#EEF2FA; --surface:#FFFFFF; --ink:#16233F; --muted:#63708A;
    --brand:#173A6B; --brand2:#2E5CC7; --brand-light:#EAF1FE; --border:#E1E7F3;
    --income:#1E9E5A; --income-bg:#E7F8EE; --expense:#E33B3B; --expense-bg:#FDEBEB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; background:var(--bg);
    position:relative;
  }
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  /* ---- Login ---- */
  .login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    background:var(--surface); border-radius:16px; padding:24px; width:100%;
    box-shadow:0 4px 24px rgba(23,58,107,0.08);
  }
  .login-card h1{color:var(--brand); font-size:22px; font-weight:700; margin:0 0 4px; text-align:center;}
  .login-logo{display:block; width:100%; max-width:150px; height:auto; margin:0 auto 22px;}
  .login-card p.sub{color:var(--muted); font-size:13px; margin:0 0 20px; text-align:center;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border:1.5px solid var(--border); border-radius:10px;
    font-size:15px; color:var(--ink); background:#fff; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand2);}
  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:10px; background:var(--brand2);
    color:#fff; font-size:15px; font-weight:600;
  }
  .btn-primary:disabled{opacity:0.6;}
  .btn-primary:active{background:var(--brand);}
  .err-text{color:var(--expense); font-size:13px; margin-top:8px;}
  .hint-text{color:var(--muted); font-size:12px; margin-top:14px; text-align:center;}

  /* ---- Top bar ---- */
  .topbar{
    background:var(--brand); color:#fff; padding:14px 14px 0;
    position:sticky; top:0; z-index:5;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; padding-bottom:10px;}
  .topbar-row h2{font-size:17px; font-weight:700; margin:0;}
  .topbar-actions{display:flex; align-items:center; gap:4px;}
  .topbar-actions button{
    background:none; border:none; color:#fff; font-size:13px; padding:7px 8px;
    display:flex; align-items:center; gap:5px; border-radius:8px;
  }
  .topbar-actions button:active{background:rgba(255,255,255,0.15);}

  /* ---- Book tabs ---- */
  .tabs{display:flex;}
  .tabs button{
    flex:1; background:none; border:none; color:rgba(255,255,255,0.65); font-size:13px;
    padding:10px 4px; border-bottom:3px solid transparent; font-weight:500;
  }
  .tabs button.active{color:#fff; border-bottom-color:#fff; font-weight:700;}

  /* ---- Content ---- */
  .content{flex:1; padding-bottom:90px; overflow-y:auto;}

  /* ---- Summary card ---- */
  .summary-card{
    background:var(--surface); margin:12px; border-radius:14px; padding:14px;
    box-shadow:0 1px 3px rgba(23,58,107,0.06);
  }
  .summary-row{display:flex; gap:8px;}
  .pill{flex:1; border-radius:10px; padding:10px;}
  .pill .lbl{font-size:11px;}
  .pill .val{font-size:15px; font-weight:700; margin-top:2px;}
  .pill.income{background:var(--income-bg); color:var(--income);}
  .pill.expense{background:var(--expense-bg); color:var(--expense);}
  .closing{margin-top:10px; font-weight:700; color:var(--brand); font-size:14px;}

  /* ---- Lists ---- */
  .empty-state{padding:32px 20px; text-align:center; color:var(--muted); font-size:13px;}
  .loading-wrap{padding:24px; text-align:center; color:var(--muted); font-size:13px;}
  .list{padding:0 12px;}
  .row-card{
    background:var(--surface); border-radius:12px; padding:12px; margin-bottom:8px;
    display:flex; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(23,58,107,0.05);
  }
  .row-card .main{flex:1; min-width:0;}
  .row-card .cat{font-weight:600; font-size:14px; color:var(--ink);}
  .row-card .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .row-card .amt{font-weight:700; font-size:14px; white-space:nowrap;}
  .row-card .amt.income{color:var(--income);}
  .row-card .amt.expense{color:var(--expense);}
  .icon-btn{background:none; border:none; padding:6px; display:flex; align-items:center; color:var(--muted);}
  .icon-btn.danger{color:var(--expense);}

  /* ---- FAB ---- */
  .fab{
    position:absolute; right:18px; bottom:82px; width:54px; height:54px; border-radius:50%;
    background:var(--brand2); color:#fff; border:none; font-size:26px; font-weight:400;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(46,92,199,0.4);
    z-index:6;
  }
  .fab:active{background:var(--brand);}

  /* ---- Bottom nav ---- */
  .bottom-nav{
    position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border);
    display:flex; z-index:5; padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--muted); font-size:11px;
  }
  .bottom-nav button.active{color:var(--brand2);}
  .bottom-nav svg{width:22px; height:22px;}

  /* ---- Sheet / modal ---- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(15,25,50,0.4); display:flex; align-items:flex-end;
    justify-content:center; z-index:20;
  }
  .sheet-overlay .sheet-wrap{width:100%; max-width:480px;}
  .sheet{
    background:var(--surface); border-radius:18px 18px 0 0; padding:20px; max-height:88vh; overflow-y:auto;
  }
  .sheet h3{margin:0 0 12px; font-size:17px; font-weight:700; color:var(--ink);}
  .sheet-sub{color:var(--muted); font-size:12px; margin:-8px 0 12px;}
  .row-2{display:flex; gap:8px;}
  .row-2 .field{flex:1;}
  .member-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);}
  .member-row span{flex:1; font-size:14px;}

  /* ---- News / Sales composer ---- */
  .composer{background:var(--surface); margin:12px; border-radius:14px; padding:12px;}
  .composer textarea{min-height:56px; resize:vertical;}
  .composer-actions{display:flex; justify-content:flex-end; margin-top:8px;}
  .post-btn{
    background:var(--brand2); color:#fff; border:none; border-radius:9px; padding:9px 16px;
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .post-btn:disabled{opacity:0.5;}
  .post-card{background:var(--surface); border-radius:12px; padding:12px; margin:0 12px 8px;}
  .post-head{display:flex; align-items:center; gap:8px;}
  .post-head .who{flex:1; min-width:0;}
  .post-head .name{font-weight:600; font-size:13px; color:var(--ink);}
  .post-head .time{font-size:11px; color:var(--muted); margin-top:1px;}
  .post-body{font-size:14px; color:var(--ink); margin-top:6px; white-space:pre-wrap;}
  .post-actions{display:flex; gap:16px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border);}
  .action-btn{background:none; border:none; padding:4px 2px; display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12.5px;}
  .action-btn.liked{color:var(--expense);}
  .comments-box{margin-top:8px; padding-top:8px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  .comment-row{display:flex; align-items:flex-start; gap:6px;}
  .comment-bubble{flex:1; background:var(--bg); border-radius:12px; padding:7px 11px;}
  .comment-name{font-weight:700; font-size:11.5px; color:var(--ink);}
  .comment-body{font-size:13px; color:var(--ink); margin-top:1px;}
  .comment-compose{display:flex; gap:6px; align-items:center;}
  .comment-compose input{flex:1; padding:9px 12px; border:1.5px solid var(--border); border-radius:20px; font-size:13px; background:#fff; color:var(--ink); outline:none;}
  .comment-compose input:focus{border-color:var(--brand2);}
  .comment-compose .icon-btn{background:var(--brand-light); color:var(--brand2); border-radius:50%; width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .sales-title{font-weight:600; font-size:14px;}
  .sales-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .sales-note{font-size:13px; color:var(--ink); margin-top:4px;}
  .sales-info{padding:12px; color:var(--muted); font-size:12px;}
  .manage-btn{
    background:none; border:none; color:var(--brand); font-size:13px; padding:12px;
    display:flex; align-items:center; gap:6px; font-weight:500;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:50; opacity:0;
    transition:opacity 0.25s; pointer-events:none; max-width:88%; text-align:center;
  }
  .toast.show{opacity:1;}

  .center-spinner{flex:1; display:flex; align-items:center; justify-content:center;}
  .spinner{
    width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--brand2);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Print ---- */
  #printArea{display:none;}
  .print-title{font-size:18px; font-weight:700; margin-bottom:2px;}
  .print-sub{font-size:12px; color:#555; margin-bottom:14px;}
  .print-summary{display:flex; gap:16px; margin-bottom:14px; font-size:13px;}
  .print-summary b{display:block; font-size:15px;}
  .print-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .print-table th, .print-table td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  .print-table th{background:#f0f0f0;}
  .print-table td.num{text-align:right; white-space:nowrap;}
  .print-footer{margin-top:16px; font-size:11px; color:#777;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:0; color:#000;}
  }
</style>
</head>

/* Talk to Supabase directly over fetch (GoTrue + PostgREST REST endpoints) instead of
   loading the @supabase/supabase-js library from a CDN. Chat/artifact sandboxes often
   block third-party <script src> loads entirely, which would silently break the whole
   app before it ever rendered anything — plain fetch() calls to the project's own API
   don't have that problem. Session token is kept in memory only (see doSignOut notes). */
let accessToken = null;

async function authFetch(path, body){
  const res = await fetch(SUPABASE_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || "Request failed");
  return data;
}

async function restRequest(path, options){
  options = options || {};
  const headers = Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + (accessToken || SUPABASE_ANON_KEY),
    "Content-Type": "application/json"
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + "/rest/v1" + path, Object.assign({}, options, { headers }));
  if (!res.ok){
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.message || "Request failed");
  }
  if (res.status === 204) return null;
  return res.json().catch(() => null);
}

/* ============== Repository helpers (mirrors Repository.kt) ============== */
function isEmailLike(v){ return v.includes("@"); }
function toE164(raw){
  const v = raw.replace(/[\s\-()]/g, "");
  if (!v) return v;
  if (v.startsWith("+")) return v;
  if (v.startsWith("880")) return "+" + v;
  if (v.startsWith("0")) return "+880" + v.substring(1);
  return "+" + v;
}
async function sha256Hex(input){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function currentUserLabel(user){
  if (!user) return null;
  return user.email || user.phone || null;
}
function currentIdentifiers(user){
  if (!user) return [];
  return [user.email, user.phone].filter(Boolean);
}

async function getRaw(key){
  const rows = await restRequest("/app_data?key=eq." + encodeURIComponent(key) + "&select=value", { method: "GET" });
  return (rows && rows[0]) ? rows[0].value : null;
}
async function setRaw(key, value){
  await restRequest("/app_data?on_conflict=key", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify([{ key, value }])
  });
}
async function getJsonList(key){
  try {
    const raw = await getRaw(key);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

let currentUser = null;

/* ============== Auth actions ============== */
async function checkSession(){
  /* Session is memory-only (see doSignOut notes), so on a fresh load there's
     nothing to restore — go straight to the login screen. */
  setState({ screen: "login" });
}

async function doSignIn(identifier, password){
  state.authError = null;
  if (!identifier.trim() || !password){
    setState({ authError: "নম্বর/ইমেইল এবং পাসওয়ার্ড দিন।" });
    return;
  }
  setState({ authLoading: true, authError: null });
  try {
    const credentials = isEmailLike(identifier)
      ? { email: identifier.trim(), password }
      : { phone: toE164(identifier.trim()), password };
    const result = await authFetch("/auth/v1/token?grant_type=password", credentials);
    accessToken = result.access_token;
    currentUser = result.user;
    setState({ screen: "app", authLoading: false });
    loadEntries();
  } catch (e){
    setState({ authLoading: false, authError: e.message || "সাইন ইন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।" });
  }
}

async function doSignOut(){
  try {
    await fetch(SUPABASE_URL + "/auth/v1/logout", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + accessToken }
    });
  } catch(e){}
  accessToken = null;
  currentUser = null;
  setState({
    screen: "login", editMode: false, entries: [], section: "accounts",
    newsPosts: [], salesPosts: [], authError: null
  });
}

/* ============== Accounts ============== */
async function loadEntries(){
  setState({ loadingEntries: true });
  const book = BOOKS[state.currentBook];
  const list = await getJsonList(book.storageKey);
  setState({ entries: list, loadingEntries: false });
}
function selectBook(key){ setState({ currentBook: key }); loadEntries(); }
function summary(){
  const book = BOOKS[state.currentBook];
  const credit = state.entries.filter(e => e.type === book.creditType).reduce((s,e)=>s+(+e.amount||0),0);
  const debit = state.entries.filter(e => e.type === book.debitType).reduce((s,e)=>s+(+e.amount||0),0);
  return { credit, debit, closing: credit - debit };
}
function money(v){
  const n = Math.round(+v || 0);
  return "৳" + n.toLocaleString("en-US");
}
async function tryUnlockEdit(pin){
  setState({ pinError: null });
  try {
    const storedHash = await getRaw("ds_edit_pin");
    const ok = storedHash && storedHash === await sha256Hex(pin);
    if (ok){ setState({ editMode: true, showPinSheet: false, pinError: null }); }
    else { setState({ pinError: "ভুল পিন।" }); }
  } catch(e){ setState({ pinError: "চেক করা যায়নি, আবার চেষ্টা করুন।" }); }
}
function lockEdit(){ setState({ editMode: false }); }

async function trySetPin(newPin, confirmPin){
  setState({ changePinError: null });
  const pin = (newPin || "").trim();
  if (pin.length < 4){
    setState({ changePinError: "PIN কমপক্ষে ৪ সংখ্যার হতে হবে।" });
    return;
  }
  if (pin !== (confirmPin || "").trim()){
    setState({ changePinError: "দুটো PIN মিলছে না।" });
    return;
  }
  try {
    const hash = await sha256Hex(pin);
    await setRaw("ds_edit_pin", hash);
    setState({ showChangePinSheet: false, changePinError: null });
    showToast("PIN পরিবর্তন করা হয়েছে।");
  } catch(e){
    setState({ changePinError: "সংরক্ষণ করা যায়নি, আবার চেষ্টা করুন।" });
  }
}
function openAddEntry(){ setState({ editingEntry: null, showEntrySheet: true }); }
function openEditEntry(entry){ setState({ editingEntry: entry, showEntrySheet: true }); }
async function saveEntry(entry){
  const book = BOOKS[state.currentBook];
  let updated;
  if (state.editingEntry){
    updated = state.entries.map(e => e.id === state.editingEntry.id ? entry : e);
  } else {
    updated = [...state.entries, { ...entry, id: entry.id || crypto.randomUUID() }];
  }

/* ============== Likes & comments (shared by News Feed and Sales News) ============== */
const POST_LISTS = {
  news: { stateKey: "newsPosts", storageKey: KEYS.NEWS_FEED },
  sales: { stateKey: "salesPosts", storageKey: KEYS.SALES_NEWS }
};
function postLikes(p){ return Array.isArray(p.likes) ? p.likes : []; }
function postComments(p){ return Array.isArray(p.comments) ? p.comments : []; }
async function togglePostLike(kind, postId){
  const cfg = POST_LISTS[kind];
  const label = currentUserLabel(currentUser) || "Someone";
  const updated = state[cfg.stateKey].map(p => {
    if (p.id !== postId) return p;
    const likes = postLikes(p);
    const has = likes.includes(label);
    return { ...p, likes: has ? likes.filter(l => l !== label) : [...likes, label] };
  });
  setState({ [cfg.stateKey]: updated });
  try { await setRaw(cfg.storageKey, JSON.stringify(updated)); }
  catch(e){ showToast("লাইক আপডেট করা যায়নি।"); }
}
async function addPostComment(kind, postId, text){
  if (!text || !text.trim()) return;
  const cfg = POST_LISTS[kind];
  const label = currentUserLabel(currentUser) || "Someone";
  const comment = { id: crypto.randomUUID(), authorLabel: label, body: text.trim(), createdAt: new Date().toISOString() };
  const updated = state[cfg.stateKey].map(p => p.id === postId ? { ...p, comments: [...postComments(p), comment] } : p);
  const key = kind + ":" + postId;
  const drafts = { ...state.commentDrafts };
  delete drafts[key];
  setState({ [cfg.stateKey]: updated, commentDrafts: drafts });
  try { await setRaw(cfg.storageKey, JSON.stringify(updated)); }
  catch(e){ showToast("কমেন্ট করা যায়নি।"); }
}
async function deletePostComment(kind, postId, commentId){
  const cfg = POST_LISTS[kind];
  const updated = state[cfg.stateKey].map(p => p.id === postId ? { ...p, comments: postComments(p).filter(c => c.id !== commentId) } : p);
  setState({ [cfg.stateKey]: updated });
  try { await setRaw(cfg.storageKey, JSON.stringify(updated)); }
  catch(e){ showToast("ডিলিট করা যায়নি।"); }
}
function toggleCommentsPanel(kind, postId){
  const key = kind + ":" + postId;
  const open = { ...state.openComments };
  open[key] = !open[key];
  setState({ openComments: open });
}
function renderPostEngagement(kind, p){
  const key = kind + ":" + p.id;
  const likes = postLikes(p);
  const comments = postComments(p);
  const myLabel = currentUserLabel(currentUser);
  const liked = likes.includes(myLabel);
  const open = !!state.openComments[key];
  const draft = state.commentDrafts[key] || "";
  return `
    <div class="post-actions">
      <button class="action-btn ${liked ? "liked" : ""}" data-like="${kind}:${p.id}">
        <div style="width:16px;height:16px;">${liked ? ICONS.heartFilled : ICONS.heart}</div>
        <span>লাইক${likes.length ? " " + likes.length : ""}</span>
      </button>
      <button class="action-btn" data-toggle-comments="${key}">
        <div style="width:16px;height:16px;">${ICONS.comment}</div>
        <span>কমেন্ট${comments.length ? " " + comments.length : ""}</span>
      </button>
    </div>
    ${open ? `
    <div class="comments-box">
      ${comments.map(c => `
        <div class="comment-row">
          <div class="comment-bubble">
            <div class="comment-name">${esc(c.authorLabel)}</div>
            <div class="comment-body">${esc(c.body)}</div>
          </div>
          ${c.authorLabel === myLabel ? `<button class="icon-btn danger" data-delete-comment="${kind}:${p.id}:${c.id}">${ICONS.trash}</button>` : ""}
        </div>`).join("")}
      ${comments.length === 0 ? `<div class="sheet-sub" style="margin:0;">এখনো কোনো কমেন্ট নেই।</div>` : ""}
      <div class="comment-compose">
        <input type="text" id="comment-input-${kind}-${p.id}" placeholder="একটা কমেন্ট লিখুন…" value="${esc(draft)}" />
        <button class="icon-btn" data-send-comment="${kind}:${p.id}">${ICONS.send}</button>
      </div>
    </div>` : ""}`;
}

function printAccountsReport(){
  const book = BOOKS[state.currentBook];

  return `

      <h3>এডিট মোড চালু করুন</h3>
      <p class="sheet-sub">Ask an admin for the shared data-entry PIN.</p>
      <form id="pinForm">
        <div class="field"><input type="password" inputmode="numeric" id="f_pin" placeholder="PIN" autofocus /></div>
        ${state.pinError ? `<div class="err-text">${esc(state.pinError)}</div>` : ""}
        <div style="height:8px"></div>
        <button type="submit" class="btn-primary">Unlock</button>
      </form>
    </div></div></div>`;
}

function renderChangePinSheet(){
  return `
    <div class="sheet-overlay" data-overlay="changePin"><div class="sheet-wrap"><div class="sheet">
      <h3>PIN পরিবর্তন করুন</h3>
      <p class="sheet-sub">সবার জন্য শেয়ার করা নতুন এডিট PIN সেট করুন। এটা সেভ হলে পুরোনো PIN আর কাজ করবে না।</p>
      <form id="changePinForm">
        <div class="field"><label>নতুন PIN</label><input type="password" inputmode="numeric" id="f_new_pin" placeholder="নতুন PIN" autofocus /></div>
        <div class="field"><label>আবার লিখুন</label><input type="password" inputmode="numeric" id="f_confirm_pin" placeholder="আবার লিখুন" /></div>
        ${state.changePinError ? `<div class="err-text">${esc(state.changePinError)}</div>` : ""}
        <div style="height:8px"></div>
        <button type="submit" class="btn-primary">PIN সংরক্ষণ করুন</button>
      </form>
    </div></div></div>`;
}

function renderNews(){
  return `
    <div class="topbar"><div class="topbar-row"><h2>News Feed</h2></div></div>
    <div class="content">
      <div class="composer">
        <textarea id="newsDraft" placeholder="কোম্পানি সম্পর্কিত কিছু শেয়ার করুন…">${esc(state.newsDraft)}</textarea>
        <div class="composer-actions">
          <button class="post-btn" id="newsPostBtn" ${state.newsDraft.trim() ? "" : "disabled"}>${ICONS.send}Post</button>
        </div>
      </div>
      ${state.loadingNews ? `<div class="loading-wrap"><div class="spinner" style="margin:0 auto"></div></div>` :
        state.newsPosts.length === 0 ? `<div class="empty-state">এখনো কোনো পোস্ট নেই — প্রথম পোস্টটি করুন।</div>` :
        state.newsPosts.map(p => `
          <div class="post-card">
            <div class="post-head">
              <div class="who"><div class="name">${esc(p.authorLabel)}</div><div class="time">${esc(formatPostTime(p.createdAt))}</div></div>
              ${p.authorLabel === currentUserLabel(currentUser) ? `<button class="icon-btn danger" data-delete-news="${p.id}">${ICONS.trash}</button>` : ""}
            </div>
            <div class="post-body">${esc(p.body)}</div>
            ${renderPostEngagement("news", p)}
          </div>
        `).join("")
      }
    </div>
    ${renderBottomNav()}
  `;
}

function renderSales(){
  return `
    <div class="topbar"><div class="topbar-row"><h2>Sales News</h2></div></div>
    <div class="content">
      ${state.editMode ? `<button class="manage-btn" id="manageSalesGroupBtn">${ICONS.groups}Sales group manage করুন</button>` :
        (!state.isSalesGroupMember ? `<div class="sales-info">শুধু Sales group-এর সদস্যরা এখানে পোস্ট করতে পারবে। তুমি এখন শুধু পড়তে পারছো।</div>` : "")
      }
      ${state.loadingSales ? `<div class="loading-wrap"><div class="spinner" style="margin:0 auto"></div></div>` :
        state.salesPosts.length === 0 ? `<div class="empty-state">এখনো কোনো সেলস আপডেট নেই।</div>` :
        state.salesPosts.map(p => {
          const metaBits = [p.quantity ? `Qty: ${esc(p.quantity)}` : null, p.customer ? `Customer: ${esc(p.customer)}` : null].filter(Boolean).join(" • ");
          return `
          <div class="post-card">
            <div class="post-head">
              <div class="who">
                <div class="sales-title">${esc(p.product || "—")}</div>
                <div class="sales-meta">${esc(p.authorLabel)} • ${esc(p.date)}</div>
              </div>
              <div class="amt income">${money(p.amount)}</div>
              ${p.authorLabel === currentUserLabel(currentUser) ? `<button class="icon-btn danger" data-delete-sales="${p.id}">${ICONS.trash}</button>` : ""}
            </div>
            ${metaBits ? `<div class="sales-meta" style="margin-top:4px">${metaBits}</div>` : ""}
            ${p.note ? `<div class="sales-note">${esc(p.note)}</div>` : ""}
            ${renderPostEngagement("sales", p)}
          </div>`;
        }).join("")
      }
    </div>
    ${state.isSalesGroupMember ? `<button class="fab" id="addSalesBtn">+</button>` : ""}
    ${renderBottomNav()}
    ${state.showSalesForm ? renderSalesForm() : ""}
    ${state.showSalesGroupSheet ? renderSalesGroupSheet() : ""}
  `;
}

function renderSalesForm(){
  const today = new Date().toISOString().slice(0,10);
  return `
    <div class="sheet-overlay" data-overlay="salesForm"><div class="sheet-wrap"><div class="sheet">
      <h3>নতুন সেলস আপডেট</h3>
      <form id="salesForm">
        <div class="field"><label>Date</label><input type="date" id="s_date" value="${today}" /></div>
        <div class="field"><label>Product / Model</label><input type="text" id="s_product" /></div>
        <div class="field"><label>Quantity</label><input type="text" id="s_qty" /></div>
        <div class="field"><label>Total amount</label><input type="number" step="0.01" id="s_amount" /></div>
        <div class="field"><label>Customer (optional)</label><input type="text" id="s_customer" /></div>
        <div class="field"><label>Note (optional)</label><input type="text" id="s_note" /></div>
        <button type="submit" class="btn-primary">Post</button>
      </form>
    </div></div></div>`;
}

function renderSalesGroupSheet(){
  return `
    <div class="sheet-overlay" data-overlay="salesGroup"><div class="sheet-wrap"><div class="sheet">
      <h3>Sales group members</h3>
      <p class="sheet-sub">যাদের নম্বর/ইমেইল এখানে যোগ করবে, শুধু তারাই Sales News-এ পোস্ট করতে পারবে।</p>
      <div class="row-2">
        <div class="field"><input type="text" id="newMember" placeholder="Mobile number or email" /></div>
        <button class="btn-primary" id="addMemberBtn" style="width:auto; padding:0 16px;">Add</button>
      </div>
      <div style="height:6px"></div>
      ${state.salesGroupMembers.map(m => `
        <div class="member-row"><span>${esc(m)}</span><button class="icon-btn danger" data-remove-member="${esc(m)}">${ICONS.trash}</button></div>
      `).join("")}
      ${state.salesGroupMembers.length === 0 ? `<p class="sheet-sub" style="margin-top:8px">এখনো কেউ যোগ করা হয়নি।</p>` : ""}
    </div></div></div>`;
}

function renderBottomNav(){
  return `
    <div class="bottom-nav">
      <button data-section="accounts" class="${state.section==='accounts'?'active':''}">${ICONS.wallet}<span>Accounts</span></button>
      <button data-section="news" class="${state.section==='news'?'active':''}">${ICONS.article}<span>News Feed</span></button>
      <button data-section="sales" class="${state.section==='sales'?'active':''}">${ICONS.campaign}<span>Sales News</span></button>
      <button data-section="purchases" class="${state.section==='purchases'?'active':''}">${ICONS.bag}<span>My Purchase</span></button>
      <button data-section="profile" class="${state.section==='profile'?'active':''}">${ICONS.profile}<span>Profile</span></button>
    </div>`;
}

function renderPurchases(){
  const sorted = [...state.purchases].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  const total = state.purchases.reduce((s,p)=>s+(+p.price||0),0);
  return `
    <div class="topbar"><div class="topbar-row"><h2>My Purchase</h2>
      <div class="topbar-actions"><button id="printPurchasesBtn">${ICONS.print}<span>Print</span></button></div>
    </div></div>
    <div class="content">
      <div class="summary-card">
        <div class="closing" style="margin-top:0">মোট খরচ: ${money(total)}</div>
      </div>
      ${state.loadingPurchases ? `<div class="loading-wrap"><div class="spinner" style="margin:0 auto"></div></div>` :
        sorted.length === 0 ? `<div class="empty-state">এখনো কোনো পার্চেজ নেই — + চেপে একটা যোগ করুন।</div>` :
        `<div class="list">${sorted.map(p => `
          <div class="row-card">
            <div class="main">
              <div class="cat">${esc(p.product || "—")}</div>
              <div class="meta">${esc([p.date, p.note].filter(Boolean).join(" • "))}</div>
            </div>
            <div class="amt expense">${money(p.price)}</div>
            <button class="icon-btn" data-edit-purchase="${p.id}">${ICONS.edit}</button>
            <button class="icon-btn danger" data-delete-purchase="${p.id}">${ICONS.trash}</button>
          </div>
        `).join("")}</div>`
      }
    </div>
    <button class="fab" id="addPurchaseBtn">+</button>
    ${renderBottomNav()}
    ${state.showPurchaseSheet ? renderPurchaseSheet() : ""}
  `;
}

function renderPurchaseSheet(){
  const p = state.editingPurchase;
  const today = new Date().toISOString().slice(0,10);
  return `
    <div class="sheet-overlay" data-overlay="purchase"><div class="sheet-wrap"><div class="sheet">
      <h3>${p ? "পার্চেজ এডিট করুন" : "নতুন পার্চেজ"}</h3>
      <form id="purchaseForm">
        <div class="field"><label>Date</label><input type="date" id="p_date" value="${esc(p ? p.date : today)}" /></div>
        <div class="field"><label>Product</label><input type="text" id="p_product" value="${esc(p ? p.product : "")}" /></div>
        <div class="field"><label>Price</label><input type="number" step="0.01" id="p_price" value="${esc(p ? p.price : "")}" /></div>
        <div class="field"><label>Note (optional)</label><input type="text" id="p_note" value="${esc(p ? p.note : "")}" /></div>
        <button type="submit" class="btn-primary">${p ? "Save changes" : "Add purchase"}</button>
      </form>
    </div></div></div>`;
}

function renderProfile(){
  const label = currentUserLabel(currentUser) || "—";
  return `
    <div class="topbar"><div class="topbar-row"><h2>Profile</h2></div></div>
    <div class="content">
      <div class="summary-card" style="display:flex; align-items:center; gap:14px;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--brand-light);color:var(--brand2);display:flex;align-items:center;justify-content:center;">
          <div style="width:26px;height:26px;">${ICONS.profile}</div>
        </div>
        <div>
          <div style="font-weight:700; font-size:15px; color:var(--ink);">${esc(label)}</div>
          <div style="font-size:12px; color:var(--muted); margin-top:2px;">${state.editMode ? "Edit mode" : "View-only"}</div>
        </div>
      </div>
      ${state.editMode ? `
      <div class="summary-card">
        <button class="btn-primary" id="changePinBtn">PIN পরিবর্তন করুন</button>
      </div>` : `
      <div class="summary-card">
        <div style="font-size:12.5px; color:var(--muted);">PIN পরিবর্তন করতে আগে Accounts ট্যাবে গিয়ে 🔒 আইকনে ট্যাপ করে বর্তমান PIN দিয়ে এডিট মোড আনলক করুন।</div>
      </div>`}
      <div class="summary-card">
        <button class="btn-primary" id="profileLogoutBtn" style="background:var(--expense);">Log out</button>
      </div>
    </div>
    ${renderBottomNav()}
    ${state.showChangePinSheet ? renderChangePinSheet() : ""}
  `;
}

function render(){
  const app = document.getElementById("app");
  let html;
  if (state.screen === "checking"){
    html = `<div class="center-spinner"><div class="spinner"></div></div>`;
  } else if (state.screen === "login"){
    html = renderLogin();
  } else {
    if (state.section === "accounts") html = renderAccounts();
    else if (state.section === "news") html = renderNews();
    else if (state.section === "profile") html = renderProfile();
    else if (state.section === "purchases") html = renderPurchases();
    else html = renderSales();
  }
  html += `<div class="toast ${state.toast ? 'show' : ''}">${state.toast ? esc(state.toast) : ''}</div>`;
  app.innerHTML = html;
  bindEvents();
}

/* ============== Event binding (re-bound after every render) ============== */
function bindEvents(){
  const app = document.getElementById("app");

  const loginForm = document.getElementById("loginForm");
  if (loginForm) loginForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    doSignIn(document.getElementById("identifier").value, document.getElementById("password").value);
  });

  const editToggleBtn = document.getElementById("editToggleBtn");
  if (editToggleBtn) editToggleBtn.addEventListener("click", () => {
    if (state.editMode) lockEdit(); else setState({ showPinSheet: true, pinError: null });
  });
  const printAccountsBtn = document.getElementById("printAccountsBtn");
  if (printAccountsBtn) printAccountsBtn.addEventListener("click", printAccountsReport);
  const printPurchasesBtn = document.getElementById("printPurchasesBtn");
  if (printPurchasesBtn) printPurchasesBtn.addEventListener("click", printPurchasesReport);
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.addEventListener("click", doSignOut);
  const profileLogoutBtn = document.getElementById("profileLogoutBtn");
  if (profileLogoutBtn) profileLogoutBtn.addEventListener("click", doSignOut);

  const changePinBtn = document.getElementById("changePinBtn");
  if (changePinBtn) changePinBtn.addEventListener("click", () => setState({ showChangePinSheet: true, changePinError: null }));
  const changePinForm = document.getElementById("changePinForm");
  if (changePinForm) changePinForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    trySetPin(document.getElementById("f_new_pin").value, document.getElementById("f_confirm_pin").value);
  });

  app.querySelectorAll("[data-book]").forEach(b => b.addEventListener("click", () => selectBook(b.dataset.book)));

  const addEntryBtn = document.getElementById("addEntryBtn");
  if (addEntryBtn) addEntryBtn.addEventListener("click", openAddEntry);

  app.querySelectorAll("[data-edit-entry]").forEach(b => b.addEventListener("click", () => {
    const entry = state.entries.find(e => e.id === b.dataset.editEntry);
    if (entry) openEditEntry(entry);
  }));
  app.querySelectorAll("[data-delete-entry]").forEach(b => b.addEventListener("click", () => {
    const entry = state.entries.find(e => e.id === b.dataset.deleteEntry);
    if (entry && confirm("এই এন্ট্রি ডিলিট করবে?")) deleteEntry(entry);
  }));

  const entryForm = document.getElementById("entryForm");
  if (entryForm) entryForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const e = state.editingEntry;
    saveEntry({
      id: e ? e.id : crypto.randomUUID(),
      date: document.getElementById("f_date").value,
      type: document.getElementById("f_type").value,
      category: document.getElementById("f_category").value,
      particular: document.getElementById("f_particular").value,
      amount: parseFloat(document.getElementById("f_amount").value) || 0,
      remarks: document.getElementById("f_remarks").value
    });
  });

  const pinForm = document.getElementById("pinForm");
  if (pinForm) pinForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    tryUnlockEdit(document.getElementById("f_pin").value);
  });

  const addPurchaseBtn = document.getElementById("addPurchaseBtn");
  if (addPurchaseBtn) addPurchaseBtn.addEventListener("click", openAddPurchase);
  app.querySelectorAll("[data-edit-purchase]").forEach(b => b.addEventListener("click", () => {
    const p = state.purchases.find(x => x.id === b.dataset.editPurchase);
    if (p) openEditPurchase(p);
  }));
  app.querySelectorAll("[data-delete-purchase]").forEach(b => b.addEventListener("click", () => {
    const p = state.purchases.find(x => x.id === b.dataset.deletePurchase);
    if (p && confirm("এই পার্চেজ ডিলিট করবে?")) deletePurchase(p);
  }));
  const purchaseForm = document.getElementById("purchaseForm");
  if (purchaseForm) purchaseForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const p = state.editingPurchase;
    savePurchase({
      id: p ? p.id : crypto.randomUUID(),
      date: document.getElementById("p_date").value,
      product: document.getElementById("p_product").value,
      price: parseFloat(document.getElementById("p_price").value) || 0,
      note: document.getElementById("p_note").value
    });
  });

  const newsDraftEl = document.getElementById("newsDraft");
  if (newsDraftEl) newsDraftEl.addEventListener("input", (ev) => {
    state.newsDraft = ev.target.value;
    const btn = document.getElementById("newsPostBtn");
    if (btn) btn.disabled = !state.newsDraft.trim();
  });
  const newsPostBtn = document.getElementById("newsPostBtn");
  if (newsPostBtn) newsPostBtn.addEventListener("click", () => postToNewsFeed(state.newsDraft));
  app.querySelectorAll("[data-delete-news]").forEach(b => b.addEventListener("click", () => {
    const post = state.newsPosts.find(p => p.id === b.dataset.deleteNews);
    if (post && confirm("এই পোস্ট ডিলিট করবে?")) deleteNewsPost(post);
  }));

  app.querySelectorAll("[data-like]").forEach(b => b.addEventListener("click", () => {
    const [kind, postId] = b.dataset.like.split(":");
    togglePostLike(kind, postId);
  }));
  app.querySelectorAll("[data-toggle-comments]").forEach(b => b.addEventListener("click", () => {
    const [kind, postId] = b.dataset.toggleComments.split(":");
    toggleCommentsPanel(kind, postId);
  }));
  app.querySelectorAll("[data-send-comment]").forEach(b => b.addEventListener("click", () => {
    const [kind, postId] = b.dataset.sendComment.split(":");
    const inputEl = document.getElementById(`comment-input-${kind}-${postId}`);
    addPostComment(kind, postId, inputEl ? inputEl.value : "");
  }));
  app.querySelectorAll("[data-delete-comment]").forEach(b => b.addEventListener("click", () => {
    const [kind, postId, commentId] = b.dataset.deleteComment.split(":");
    if (confirm("এই কমেন্ট ডিলিট করবে?")) deletePostComment(kind, postId, commentId);
  }));
  app.querySelectorAll("input[id^='comment-input-']").forEach(inp => {
    const rest = inp.id.slice("comment-input-".length);
    const dashIdx = rest.indexOf("-");
    const kind = rest.slice(0, dashIdx);
    const postId = rest.slice(dashIdx + 1);
    const key = kind + ":" + postId;
    inp.addEventListener("input", (ev) => { state.commentDrafts[key] = ev.target.value; });
    inp.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter"){ ev.preventDefault(); addPostComment(kind, postId, inp.value); }
    });
  });

  const addSalesBtn = document.getElementById("addSalesBtn");
  if (addSalesBtn) addSalesBtn.addEventListener("click", () => setState({ showSalesForm: true }));
  const manageSalesGroupBtn = document.getElementById("manageSalesGroupBtn");
  if (manageSalesGroupBtn) manageSalesGroupBtn.addEventListener("click", () => setState({ showSalesGroupSheet: true }));

  const salesForm = document.getElementById("salesForm");
  if (salesForm) salesForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    postToSalesNews({
      date: document.getElementById("s_date").value,
      product: document.getElementById("s_product").value,
      quantity: document.getElementById("s_qty").value,
      amount: parseFloat(document.getElementById("s_amount").value) || 0,
      customer: document.getElementById("s_customer").value,
      note: document.getElementById("s_note").value
    });
  });
  app.querySelectorAll("[data-delete-sales]").forEach(b => b.addEventListener("click", () => {
    const post = state.salesPosts.find(p => p.id === b.dataset.deleteSales);
    if (post && confirm("এই পোস্ট ডিলিট করবে?")) deleteSalesPost(post);
  }));

  const addMemberBtn = document.getElementById("addMemberBtn");
  if (addMemberBtn) addMemberBtn.addEventListener("click", () => {
    const input = document.getElementById("newMember");
    addSalesGroupMember(input.value);
    input.value = "";
  });
  app.querySelectorAll("[data-remove-member]").forEach(b => b.addEventListener("click", () => removeSalesGroupMember(b.dataset.removeMember)));

  app.querySelectorAll(".bottom-nav [data-section]").forEach(b => b.addEventListener("click", () => selectSection(b.dataset.section)));

  app.querySelectorAll(".sheet-overlay").forEach(ov => ov.addEventListener("click", (ev) => {
    if (ev.target !== ov) return; // only close on backdrop click, not sheet content
    const which = ov.dataset.overlay;
    if (which === "entry") setState({ showEntrySheet: false, editingEntry: null });
    if (which === "pin") setState({ showPinSheet: false, pinError: null });
    if (which === "changePin") setState({ showChangePinSheet: false, changePinError: null });
    if (which === "salesForm") setState({ showSalesForm: false });
    if (which === "salesGroup") setState({ showSalesGroupSheet: false });
    if (which === "purchase") setState({ showPurchaseSheet: false, editingPurchase: null });
  }));
}

/* ============== Boot ============== */
render();
checkSession();
</script>
</body>
</html>
