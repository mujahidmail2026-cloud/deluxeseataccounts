          <div class="cat-row"><span class="name">Current book value (est.)</span><span class="amt">${money(totalBookValue)}</span></div>
        </div>
        ${state.editMode ? `<button type="button" class="btn-secondary" style="width:100%;margin-bottom:12px;" onclick="openAssetForm()">+ Add asset</button>` : ''}
        ${state.ui.assetFormOpen ? `
        <div class="panel-card" style="margin-bottom:14px;">
          <div class="form-row"><label>Asset name</label><input type="text" id="asset-name" placeholder="যেমনঃ Cutting Machine"></div>
          <div class="form-row"><label>Category (optional)</label><input type="text" id="asset-category" placeholder="Machine / Furniture / Vehicle..."></div>
          <div class="form-row">${dateFieldHtml('asset-date', new Date().toISOString().slice(0, 10), '')}</div>
          <div class="form-row"><label>Purchase cost</label><input type="number" id="asset-cost"></div>
          <div class="form-row"><label>Useful life (years, optional)</label><input type="number" id="asset-life" placeholder="ডেপ্রিসিয়েশন হিসাবের জন্য"></div>
          <div class="form-row"><label>Note (optional)</label><input type="text" id="asset-note"></div>
          <div id="asset-form-err" class="pin-error"></div>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn-secondary" style="flex:1;" onclick="closeAssetForm()">Cancel</button>
            <button type="button" class="btn-primary" style="flex:1;" onclick="saveNewAsset()">Save</button>
          </div>
        </div>` : ''}
        <div class="summary-details-list">
          ${state.assets.length === 0
            ? `<div class="empty-state"><div class="big">No assets yet</div></div>`
            : state.assets.slice().sort(function (a, b) { return (b.purchaseDate || '').localeCompare(a.purchaseDate || ''); }).map(function (a) {
              return `<div class="sd-row">
                <div class="sd-ic closing">🗄</div>
                <div class="sd-label">${esc(a.name)}${a.category ? ' · ' + esc(a.category) : ''}<div style="font-size:11.5px;color:var(--muted);font-weight:500;">${a.purchaseDate ? esc(fmtDate(a.purchaseDate)) : ''}${a.usefulLifeYears ? ' · ' + a.usefulLifeYears + ' yrs' : ''}</div></div>
                <div class="sd-value-wrap">
                  <span class="sd-value closing">${money(assetBookValue(a))}</span>
                  ${state.editMode ? `<button type="button" class="details-link" onclick="if(confirm('এই অ্যাসেটটি মুছে ফেলতে চান?')) deleteAsset('${a.id}')">Delete</button>` : ''}
                </div>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="sheet-foot row">
        <button class="btn-secondary" style="width:100%;" onclick="closeAssetsModal()">Close</button>
      </div>
    </div>
  </div>`;
}

/* ===================== Documents ===================== */
function openDocumentsModal() { state.ui.documentsModalOpen = true; render(); }
function closeDocumentsModal() { state.ui.documentsModalOpen = false; render(); }
function triggerDocumentUpload() {
  if (!state.editMode) { showToast('Unlock edit mode first'); return; }
  document.getElementById('document-upload-input').click();
}
function handleDocumentUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) { showToast('ফাইলটি খুব বড় (৪MB-এর বেশি) — ছোট ফাইল ব্যবহার করুন'); return; }
  const reader = new FileReader();
  reader.onload = async function (e) {
    const doc = { id: uid(), name: file.name, uploadedDate: new Date().toISOString().slice(0, 10), dataUrl: e.target.result, note: '' };
    state.documents.push(doc);
    const ok = await persistDocuments();
    if (!ok) { state.documents.pop(); render(); return; }
    render();
    showToast('ফাইল যোগ হয়েছে');
  };
  reader.readAsDataURL(file);
}
async function deleteDocument(id) {
  const backup = state.documents;
  state.documents = state.documents.filter(function (d) { return d.id !== id; });
  const ok = await persistDocuments();
  if (!ok) { state.documents = backup; render(); return; }
  render();
}
function renderDocumentsModal() {
  const docs = state.documents.slice().sort(function (a, b) { return (b.uploadedDate || '').localeCompare(a.uploadedDate || ''); });
  return `
  <div class="sheet-overlay" onclick="if(event.target===this) closeDocumentsModal()">
    <div class="sheet tall">
      <div class="sheet-head"><h3>Documents</h3><button onclick="closeDocumentsModal()">✕</button></div>
      <div class="sheet-body">
        ${state.editMode ? `<button type="button" class="btn-secondary" style="width:100%;margin-bottom:12px;" onclick="triggerDocumentUpload()">⬆ Upload file</button>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">যেকোনো ফাইল (ইনভয়েস, রসিদ, চুক্তি ইত্যাদি) — সর্বোচ্চ ৪MB</div>` : ''}
        <div class="summary-details-list">
          ${docs.length === 0
            ? `<div class="empty-state"><div class="big">No documents yet</div></div>`
            : docs.map(function (d) {
              return `<div class="sd-row">
                <div class="sd-ic">📄</div>
                <div class="sd-label">${esc(d.name)}<div style="font-size:11.5px;color:var(--muted);font-weight:500;">${esc(fmtDate(d.uploadedDate))}</div></div>
                <div class="sd-value-wrap">
                  <a href="${d.dataUrl}" download="${esc(d.name)}" class="details-link">Download</a>
                  ${state.editMode ? `<button type="button" class="details-link" onclick="if(confirm('এই ফাইলটি মুছে ফেলতে চান?')) deleteDocument('${d.id}')">Delete</button>` : ''}
                </div>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="sheet-foot row">
        <button class="btn-secondary" style="width:100%;" onclick="closeDocumentsModal()">Close</button>
      </div>
    </div>
  </div>`;
}

/* ===================== Reports (Profit & Loss / Net Worth) ===================== */
function openReportsModal() { state.ui.reportsModalOpen = true; render(); }
function closeReportsModal() { state.ui.reportsModalOpen = false; render(); }
function setReportsTab(tab) { state.ui.reportsTab = tab; render(); }
function setReportsRange(field, value) { state.ui.reportsRange[field] = value; render(); }
function clearReportsRange() { state.ui.reportsRange = { from: '', to: '' }; render(); }
function inReportsRange(dateStr) {
  const from = state.ui.reportsRange.from, to = state.ui.reportsRange.to;
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}
function plReportData() {
  const ie = state.entries.ie.filter(function (e) { return inReportsRange(e.date); });
  const sales = state.entries.sales.filter(function (e) { return inReportsRange(e.date) && e.status !== 'Cancelled & Returned'; });
  const revenue = sales.reduce(function (s, r) { return s + (Number(r.totalPrice) || 0); }, 0);
  const otherIncome = ie.filter(function (e) { return e.type === CREDIT_TYPE.ie && e.category !== 'Investment'; }).reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
  const expenseRows = groupBySum(ie.filter(function (e) { return e.type === DEBIT_TYPE.ie; }), 'category', 'amount');
  const totalExpense = expenseRows.reduce(function (s, r) { return s + r.amt; }, 0);
  const cogs = ie.filter(function (e) { return e.type === DEBIT_TYPE.ie && e.category === 'Raw Materials'; }).reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
  const grossProfit = revenue - cogs;
  const netProfit = revenue + otherIncome - totalExpense;
  return { revenue: revenue, otherIncome: otherIncome, cogs: cogs, grossProfit: grossProfit, expenseRows: expenseRows, totalExpense: totalExpense, netProfit: netProfit };
}
function netWorthReportData() {
  const accountsTotal = state.accounts.reduce(function (s, a) { return s + accountBalance(a.id); }, 0);
  const assetsTotal = state.assets.reduce(function (s, a) { return s + assetBookValue(a); }, 0);
  const receivableTotal = customerDueList().reduce(function (s, c) { return s + c.total; }, 0);
  const investmentTotal = (state.entries.ie || []).filter(function (e) { return e.type === CREDIT_TYPE.ie && e.category === 'Investment'; }).reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
  const total = accountsTotal + assetsTotal + receivableTotal;
  return { accountsTotal: accountsTotal, assetsTotal: assetsTotal, receivableTotal: receivableTotal, investmentTotal: investmentTotal, total: total };
}
function renderReportsModal() {
  const r = state.ui.reportsRange;
  const tab = state.ui.reportsTab;
  return `
  <div class="sheet-overlay" onclick="if(event.target===this) closeReportsModal()">
    <div class="sheet tall">
      <div class="sheet-head"><h3>Reports</h3><button onclick="closeReportsModal()">✕</button></div>
      <div class="sheet-body">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button type="button" class="icon-pill ${tab === 'pl' ? 'primary' : ''}" style="flex:1;" onclick="setReportsTab('pl')">Profit &amp; Loss</button>
          <button type="button" class="icon-pill ${tab === 'networth' ? 'primary' : ''}" style="flex:1;" onclick="setReportsTab('networth')">Net Worth</button>
        </div>
        ${tab === 'pl' ? `
        <div class="dash-range" style="margin-bottom:12px;">
          ${dateFieldHtml('rep-from-date', r.from, `onchange="setReportsRange('from', parseDateInput(this.value))" onblur="this.value=isoToDisplay(parseDateInput(this.value))"`)}
          <span style="color:var(--muted);">→</span>
          ${dateFieldHtml('rep-to-date', r.to, `onchange="setReportsRange('to', parseDateInput(this.value))" onblur="this.value=isoToDisplay(parseDateInput(this.value))"`)}
          ${(r.from || r.to) ? `<button class="details-link" onclick="clearReportsRange()">Clear</button>` : ''}
        </div>
        ${renderPLReport()}` : renderNetWorthReport()}
      </div>
      <div class="sheet-foot row">
        <button class="btn-secondary" style="width:100%;" onclick="closeReportsModal()">Close</button>
      </div>
    </div>
  </div>`;
}
function renderPLReport() {
  const d = plReportData();
  return `
    <div class="section-title" style="margin-top:0;">Sales Revenue</div>
    <div class="total-pill in" style="margin-bottom:10px;"><span>Revenue (completed orders)</span><span>${money(d.revenue)}</span></div>
    <div class="cat-breakdown" style="margin-bottom:12px;">
      <div class="cat-row"><span class="name">Cost of Goods Sold</span><span class="amt">-${money(d.cogs)}</span></div>
      <div class="cat-row"><span class="name" style="font-weight:800;">Gross Profit</span><span class="amt" style="font-weight:800;">${money(d.grossProfit)}</span></div>
    </div>
    <div class="section-title">Other Income</div>
    <div class="total-pill in" style="margin-bottom:12px;"><span>Income-Expense বইয়ের ইনকাম (Investment বাদে)</span><span>${money(d.otherIncome)}</span></div>
    <div class="section-title">Operating Expenses</div>
    <div class="cat-breakdown" style="margin-bottom:12px;">
      ${d.expenseRows.length === 0 ? `<div class="cat-row"><span class="name muted">No expenses</span></div>` :
        d.expenseRows.map(function (row) { return `<div class="cat-row"><span class="name">${esc(row.name)}</span><span class="amt">${money(row.amt)}</span></div>`; }).join('')}
      <div class="cat-row"><span class="name" style="font-weight:800;">Total Expense</span><span class="amt" style="font-weight:800;">${money(d.totalExpense)}</span></div>
    </div>
    <div class="total-pill ${d.netProfit < 0 ? 'out' : 'in'}"><span>Net Profit</span><span>${money(d.netProfit)}</span></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;">এটি Sales + Income-Expense বই মিলিয়ে সরল Profit &amp; Loss হিসাব — Received-Expense বই আলাদা ব্যক্তিগত হিসাব বলে এতে ধরা হয়নি।</div>
  `;
}
function renderNetWorthReport() {
  const d = netWorthReportData();
  return `
    <div class="section-title" style="margin-top:0;">Assets</div>
    <div class="cat-breakdown" style="margin-bottom:12px;">
      <div class="cat-row"><span class="name">Account balances (Bank/Cash)</span><span class="amt">${money(d.accountsTotal)}</span></div>
      <div class="cat-row"><span class="name">Fixed assets (book value)</span><span class="amt">${money(d.assetsTotal)}</span></div>
      <div class="cat-row"><span class="name">Customer due (receivable)</span><span class="amt">${money(d.receivableTotal)}</span></div>
      <div class="cat-row"><span class="name" style="font-weight:800;">Total</span><span class="amt" style="font-weight:800;">${money(d.total)}</span></div>
    </div>
    <div class="section-title">Investment (reference)</div>
    <div class="total-pill in" style="margin-bottom:8px;"><span>Total investment received (all time)</span><span>${money(d.investmentTotal)}</span></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;">এটি একটি সরল Net Worth সারাংশ, ফরমাল অডিটেড Balance Sheet নয় — দায়/Liability আলাদাভাবে ট্র্যাক করা হচ্ছে না।</div>
  `;
}

/* ===================== Init ===================== */
(async function init() {
  await refreshSession();
  loadAll();
  ensureJsPDF().catch(() => { /* will retry / fall back to print when the user taps Download */ });
})();

</script>
</body>
