<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deluxe Seat — Accounts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF2FA;
  --surface:#FFFFFF;
  --ink:#16233F;
  --muted:#63708A;
  --brand:#173A6B;
  --brand2:#2E5CC7;
  --brand-light:#EAF1FE;
  --border:#E1E7F3;
  --income:#1E9E5A;
  --income-bg:#E7F8EE;
  --expense:#E33B3B;
  --expense-bg:#FDEBEB;
  --closing:#7C4FE0;
  --closing-bg:#F1EBFD;
  --amber:#E8A93A;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1440px;margin:0 auto;height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.loading{padding:70px 20px;text-align:center;color:var(--muted);font-size:16px;}

/* ---------- header ---------- */
.topbar{flex:0 0 auto;position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),#0F2C55);color:#fff;padding:10px 20px;border-radius:0 0 16px 16px;}
.topbar-row1{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.topbar h1{font-weight:800;font-size:19px;margin:0;line-height:1.2;letter-spacing:0.1px;}
.topbar .sub{font-size:11.5px;color:rgba(255,255,255,0.72);margin-top:0;}
.logo-badge{background:#fff;border-radius:9px;padding:4px 6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
.lock-btn{
  border:1px solid rgba(255,255,255,0.3);background:#fff;color:var(--brand);
  font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:22px;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.lock-btn.unlocked{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.35);}
.lock-btn.view-badge{cursor:default;}
.book-toggle{display:flex;background:rgba(255,255,255,0.12);border-radius:10px;padding:3px;gap:2px;}
.book-toggle button{
  flex:1;border:none;background:transparent;color:rgba(255,255,255,0.75);font-family:inherit;
  font-size:14px;font-weight:600;padding:10px 6px;border-radius:8px;cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.book-toggle button.active{background:#fff;color:var(--brand);}

/* ---------- layout ---------- */
.filter-bar-full{flex:0 0 auto;padding:6px 0 0;}
.filter-bar-full .filter-card{border-radius:var(--radius);border-left:1px solid var(--border);border-right:1px solid var(--border);}
.app-body{display:flex;gap:14px;align-items:stretch;padding:0 14px;flex:1 1 auto;min-height:0;overflow:hidden;}
.side-menu{display:flex;flex-direction:column;gap:6px;flex:0 0 208px;position:static;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(20,40,80,0.04);align-self:stretch;overflow-y:auto;}
.side-menu button{display:flex;flex-direction:row;align-items:center;gap:12px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-size:14.5px;font-weight:600;padding:12px 14px;border-radius:11px;cursor:pointer;line-height:1.2;text-align:left;transition:background .15s ease,color .15s ease;}
.side-menu button .ic{font-size:19px;line-height:1;flex-shrink:0;width:22px;text-align:center;}
.side-menu button.active{background:var(--brand-light);color:var(--brand);font-weight:700;}
.side-menu button:not(.active):hover{background:var(--bg);}
.content{flex:1;min-width:0;height:100%;padding:12px 0 40px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.col-filters{order:1;}
.col-main{order:2;}
.dash-row{display:flex;gap:14px;align-items:flex-start;margin-top:4px;}
.dash-row .dash-main{flex:1 1 62%;min-width:0;}
.dash-row .dash-side{flex:1 1 34%;min-width:280px;}
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:0 2px 10px rgba(20,40,80,0.03);}
.panel-head{display:flex;justify-content:flex-start;align-items:center;gap:14px;margin-bottom:10px;}
.panel-head h3{margin:0;font-size:17px;font-weight:800;color:var(--ink);}
.sub-head{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--ink);margin:4px 0 8px;}
.sub-head .dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
.sub-head .dot.in{background:var(--income);}
.sub-head .dot.out{background:var(--expense);}
.total-pill{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14.5px;}
.total-pill.in{background:var(--income-bg);color:var(--income);}
.total-pill.out{background:var(--expense-bg);color:var(--expense);}
.summary-details-list{display:flex;flex-direction:column;}
.sd-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);}
.sd-row:last-child{border-bottom:none;}
.sd-ic{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--brand-light);color:var(--brand);}
.sd-ic.income{background:var(--income-bg);color:var(--income);}
.sd-ic.expense{background:var(--expense-bg);color:var(--expense);}
.sd-ic.closing{background:var(--closing-bg);color:var(--closing);}
.sd-label{flex:1;font-size:14px;color:var(--ink);font-weight:600;}
.sd-value{font-weight:700;font-variant-numeric:tabular-nums;}
.sd-value.income{color:var(--income);}
.sd-value.expense{color:var(--expense);}
.sd-value.closing{color:var(--closing);}
.sd-value-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.sd-month-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;font-weight:700;color:var(--muted);}
.sd-month-row select{width:auto;min-width:130px;}
.section-title{font-size:13.5px;font-weight:800;color:var(--ink);margin:10px 2px 8px;}
.section-title:first-child{margin-top:0;}

/* ---------- filter bar ---------- */
.filter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;}
.filter-card-head{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.export-wrap{position:relative;display:flex;gap:8px;}
.icon-pill{
  border:1px solid var(--border);background:var(--brand-light);color:var(--brand);font-family:inherit;
  font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;
}
.icon-pill.primary{background:var(--brand2);color:#fff;border-color:var(--brand2);box-shadow:0 2px 8px rgba(46,92,199,0.35);}
.export-menu{
  position:absolute;top:32px;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:40;min-width:200px;overflow:hidden;max-height:70vh;overflow-y:auto;
}
.export-menu button{
  display:block;width:100%;text-align:left;border:none;background:none;padding:11px 14px;font-family:inherit;
  font-size:14px;cursor:pointer;color:var(--ink);
}
.export-menu button:hover{background:var(--brand-light);}
.export-menu button + button{border-top:1px solid var(--border);}
.export-menu-divider{height:1px;background:var(--border);margin:2px 0;}
.export-menu-label{padding:8px 14px 3px;font-size:10.5px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;color:var(--muted);}

/* single-line, compact filter row: every field is an inline cluster instead of a stacked block */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;row-gap:8px;}
.filter-field{flex:0 1 118px;min-width:92px;}
.filter-field.wide{flex-basis:150px;}
.filter-field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
select, .fake-select, input[type=date], input[type=text], input[type=number], input[type=password]{
  width:100%;border:1px solid var(--border);background:var(--brand-light);color:var(--ink);
  border-radius:9px;padding:10px 11px;font-family:inherit;font-size:15px;font-weight:500;appearance:none;
}
.date-field{display:flex;gap:6px;align-items:stretch;}
.date-field input[type=text]{flex:1;min-width:0;}
.date-pick-btn{flex:0 0 auto;border:1px solid var(--border);background:var(--brand-light);color:var(--brand);border-radius:9px;padding:0 12px;cursor:pointer;font-size:16px;line-height:1;}
.filter-card .date-pick-btn{padding:0 9px;font-size:13px;}
.filter-card select, .filter-card .fake-select, .filter-card input[type=date]{padding:7px 9px;font-size:12.5px;border-radius:8px;}
select:focus, input:focus{outline:2px solid var(--brand);outline-offset:1px;}
.fake-select{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.filter-toggle-row{display:flex;gap:8px;margin-bottom:10px;}
.seg{display:flex;flex:1;background:var(--brand-light);border-radius:9px;padding:3px;border:1px solid var(--border);}
.seg button{flex:1;border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:7px 4px;border-radius:7px;cursor:pointer;}
.seg button.active{background:var(--brand);color:#fff;}
.filter-card .seg{padding:2px;border-radius:8px;}
.filter-card .seg button{font-size:11px;padding:6px 4px;border-radius:6px;white-space:nowrap;}
.filter-divider{align-self:stretch;width:1px;background:var(--border);margin:2px 2px;}
.filter-label-inline{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:800;color:var(--ink);flex:0 0 auto;white-space:nowrap;padding-right:2px;}
.filter-label-inline .ic{font-size:20px;line-height:1;}
.filter-export-end{margin-left:auto;flex:0 0 auto;}

/* ---------- sheets / modals (shared) ---------- */
.sheet-overlay{position:fixed;inset:0;background:rgba(20,30,25,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,0.2);}
.sheet.small{max-height:60vh;}
.sheet.tall{max-height:92vh;}
.sheet-head{padding:18px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.sheet-head h3{margin:0;font-size:19px;font-weight:700;}
.sheet-head button{border:none;background:var(--brand-light);color:var(--brand);font-weight:700;border-radius:8px;padding:8px 13px;font-size:14px;cursor:pointer;}
.sheet-body{overflow-y:auto;padding:14px 18px;flex:1;}
.sheet-foot{padding:14px 18px 18px;border-top:1px solid var(--border);}
.sheet-foot.row{display:flex;gap:10px;}
.cat-item{display:flex;align-items:center;gap:13px;padding:12px 8px;border-radius:10px;}
.cat-item:active{background:var(--brand-light);}
.cat-item input{width:20px;height:20px;accent-color:var(--brand);}
.cat-item span{font-size:15px;}
.btn-primary{flex:1.4;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;}
.btn-secondary{flex:1;background:var(--brand-light);color:var(--brand);border:none;border-radius:10px;padding:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;}
.pin-error{color:var(--expense);font-size:13.5px;min-height:18px;margin-top:6px;}

/* ---------- full-screen auth gate ---------- */
.auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:linear-gradient(160deg,var(--bg),#DCE5F7);}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 24px 22px;box-shadow:0 10px 30px rgba(20,40,80,0.08);}
.auth-card .logo-badge{margin:0 auto 14px;width:52px;height:52px;}
.auth-card .logo-badge img{height:30px;}
.auth-title{text-align:center;font-size:20px;font-weight:800;color:var(--ink);margin:0 0 2px;}
.auth-sub{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
.auth-tabs{display:flex;background:var(--brand-light);border-radius:10px;padding:3px;gap:2px;margin-bottom:18px;}
.auth-tabs button{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:9px 4px;border-radius:8px;cursor:pointer;}
.auth-tabs button.active{background:var(--brand);color:#fff;}
.auth-hint{font-size:12.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.4;}
.auth-switch{margin-top:10px;font-size:13px;color:var(--muted);text-align:center;}
.auth-switch a{color:var(--brand);font-weight:700;text-decoration:none;}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;display:flex;flex-direction:row;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(20,40,80,0.03);}
.kpi-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--brand-light);color:var(--brand);flex-shrink:0;}
.kpi-ic.income{background:var(--income-bg);color:var(--income);}
.kpi-ic.expense{background:var(--expense-bg);color:var(--expense);}
.kpi-ic.closing{background:var(--closing-bg);color:var(--closing);}
.kpi-card .label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px;white-space:nowrap;}
.kpi-card .value{font-size:17px;font-weight:800;letter-spacing:-0.2px;color:var(--ink);}
.kpi-card .value.neg{color:var(--expense);}
.kpi-card .value.income{color:var(--income);}
.kpi-card .value.expense{color:var(--expense);}
.kpi-card .value.closing{color:var(--closing);}
.kpi-card .info-ic{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--border);color:var(--muted);font-size:10px;font-style:normal;font-weight:800;margin-left:4px;cursor:pointer;vertical-align:middle;}
@media (max-width:600px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} .kpi-card .label{white-space:normal;} }

/* ---------- dashboard ---------- */
.dash-header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:16px;}
.dash-header-row h2{font-size:22px;font-weight:800;color:var(--ink);margin:0;}
.dash-header-row .sub{font-size:13px;color:var(--muted);margin-top:2px;}
.dash-range{display:flex;align-items:center;gap:8px;}
.dash-range input[type=date]{padding:8px 10px;}
.dash-row2{display:flex;gap:10px;align-items:stretch;margin-top:10px;flex-wrap:wrap;}
.dash-row2 .kpi-card{flex:0 0 200px;}
.balance-panel{flex:1;min-width:260px;border-radius:var(--radius);padding:14px 20px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#e63950,#6a2c91);color:#fff;box-shadow:0 4px 16px rgba(100,20,60,0.25);}
.balance-panel .ic-box{background:rgba(255,255,255,0.2);border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.balance-panel .label{font-size:12.5px;opacity:0.92;font-weight:700;}
.balance-panel .value{font-size:23px;font-weight:800;letter-spacing:-0.2px;}
@media (max-width:700px){ .dash-row2{flex-direction:column;} .dash-row2 .kpi-card{flex:1;} }
.re-summary-section{margin-top:22px;padding-top:16px;border-top:1px dashed var(--border);}
.re-summary-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.re-summary-head .ic{font-size:20px;background:var(--brand-light);width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.re-summary-head .title{font-size:14.5px;font-weight:800;color:var(--ink);}
.re-summary-head .note{font-size:11.5px;color:var(--muted);margin-top:1px;}
.re-summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:600px){ .re-summary-cards{grid-template-columns:1fr;} }

/* ---------- category breakdown ---------- */
.two-col-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cat-breakdown{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-bottom:1px solid var(--border);font-size:15px;}
.cat-row:last-child{border-bottom:none;}
.cat-row .name{color:var(--ink);}
.cat-row .name.muted{color:var(--muted);}
.cat-row .amt{font-weight:700;font-variant-numeric:tabular-nums;}
.cat-row .amt-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.details-link{border:none;background:none;color:var(--brand);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;}

/* ---------- ledger toggle ---------- */
.ledger-toggle-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.ledger-toggle-card .txt .big{font-weight:700;font-size:15px;}
.ledger-toggle-card .txt .small{font-size:12.5px;color:var(--muted);margin-top:2px;}

/* ---------- ledger ---------- */
.ledger-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ledger-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;border-left:4px solid var(--income);position:relative;}
.ledger-item.debit{border-left-color:var(--expense);}
.ledger-item.sales-item{border-left-color:var(--brand);}
.ledger-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;padding-right:78px;}
.ledger-top .who{font-weight:700;font-size:15.5px;}
.badge{font-size:11.5px;font-weight:700;background:var(--brand-light);color:var(--brand);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.ledger-mid{font-size:13px;color:var(--muted);margin-bottom:7px;}
.ledger-bottom{display:flex;justify-content:space-between;align-items:baseline;}
.ledger-amt{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;}
.ledger-amt.credit{color:var(--income);}
.ledger-amt.debit{color:var(--expense);}
.ledger-bal{font-size:12.5px;color:var(--muted);}
.ledger-actions{position:absolute;top:11px;right:11px;display:flex;gap:6px;}
.icon-btn{border:none;background:var(--brand-light);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand);font-size:14px;}
.icon-btn.danger{color:var(--expense);background:var(--expense-bg);}

.empty-state{text-align:center;padding:44px 20px;color:var(--muted);}
.empty-state .big{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;}

/* ---------- form ---------- */
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.form-group-title{font-size:13px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:0.4px;margin:18px 0 10px;}
.form-group-title:first-child{margin-top:2px;}
.item-card{background:var(--brand-light);border:1px solid var(--border);border-radius:12px;padding:12px 14px 2px;margin-bottom:10px;}
.item-card-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--brand);margin-bottom:8px;}
.order-no{font-weight:500;font-size:12.5px;color:var(--muted);}
.type-seg{display:flex;gap:8px;margin-bottom:14px;}
.type-seg button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--border);background:var(--brand-light);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);}
.type-seg button.active.credit{background:var(--income);border-color:var(--income);color:#fff;}
.type-seg button.active.debit{background:var(--expense);border-color:var(--expense);color:#fff;}

/* ---------- FAB / toast ---------- */
.fab{position:fixed;right:20px;bottom:24px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:28px;box-shadow:0 6px 18px rgba(23,63,47,0.35);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:88%;text-align:center;}
.toast.show{opacity:1;}

/* ---------- receipt / print ---------- */
.receipt{font-size:15px;}
.receipt h2{margin:0 0 2px;font-size:20px;}
.receipt-sub{color:var(--muted);font-size:13.5px;margin-bottom:14px;}
.receipt table{width:100%;border-collapse:collapse;}
.receipt table td{padding:8px 4px;border-bottom:1px solid var(--border);}
.receipt table td:first-child{color:var(--muted);width:42%;}
.receipt table:not(.list-table) td:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.receipt table tr.total td{font-weight:700;font-size:17px;border-top:2px solid var(--ink);border-bottom:none;}
.list-table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
.list-table th,.list-table td{border:1px solid var(--border);padding:7px 9px;text-align:left;overflow-wrap:break-word;}
.list-table th{background:var(--brand-light);}
.list-table th.num,.list-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.prod-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);}
.prod-table th{background:var(--brand-light);color:var(--brand);text-align:left;padding:9px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0;}
.prod-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.prod-table tr:last-child td{border-bottom:none;}
.prod-table input{border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:7px;font-size:13.5px;width:100%;}
.prod-table input:hover{background:var(--brand-light);}
.prod-table input:focus{background:#fff;border-color:var(--brand2);outline:none;}

@media (max-width:520px){ .filter-divider{display:none;} }

.print-only{display:none;}
@media print{
  body{background:#fff;}
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{
    display:block;position:absolute;left:0;top:0;
    width:calc(100% - 24px);
    margin:12px;
    padding:18px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:10px;
    box-sizing:border-box;
  }
}

/* ---------- desktop ---------- */
@media (min-width:860px){
  .fab{right:24px;}
}

function getModelOptions() {
  const fromProducts = state.products.map(p => p.model).filter(Boolean);
  return fromProducts.length ? fromProducts : SALES_LISTS.models;
}
function findProduct(model) { return state.products.find(p => p.model === model); }
/* Inventory: bump (sign=+1) or deduct (sign=-1) product stock for a set of sold items */
function adjustStockForItems(items, sign) {
  (items || []).forEach(function (it) {
    const p = findProduct(it.model);
    if (!p) return;
    const qty = Number(it.quantity) || 0;
    p.stock = (Number(p.stock) || 0) + sign * qty;
  });
}

/* ===================== Helpers ===================== */
function dedupe(arr) { return Array.from(new Set((arr || []).filter(Boolean))); }
// Keeps the catch-all "Others" option at the end when merging in custom additions.
function mergeCategoryList(base, custom) {
  const withoutOthers = base.filter(c => c !== 'Others');
  const hasOthers = base.includes('Others');
  const extras = dedupe(custom).filter(c => !base.includes(c));
  return hasOthers ? [...withoutOthers, ...extras, 'Others'] : [...base, ...extras];
}
function purposeOptions() {
  return dedupe([...INVESTMENT_PURPOSE_OPTIONS, ...(state.customLists.purposes || [])]);
}
function categoriesForType(book, type) {
  const credit = CREDIT_TYPE[book], debit = DEBIT_TYPE[book];
  const extra = book === 're' ? ['General'] : [];
  const incomeCats = mergeCategoryList(INCOME_CATEGORIES, state.customLists.incomeCategories);
  const expenseCats = mergeCategoryList(EXPENSE_CATEGORIES, state.customLists.expenseCategories);
  if (type === credit) return [...incomeCats, ...extra];
  if (type === debit) return [...expenseCats, ...extra];
  return dedupe([...incomeCats, ...expenseCats, ...extra]);
}
function money(n) {
  const v = Number(n) || 0;
  return '৳' + v.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
function parseDateInput(ddmmyyyyStr) {
  if (!ddmmyyyyStr || ddmmyyyyStr.length !== 10 || ddmmyyyyStr[2] !== '/' || ddmmyyyyStr[5] !== '/') return '';
  const dd = ddmmyyyyStr.slice(0, 2);
  const mm = ddmmyyyyStr.slice(3, 5);
  const yyyy = ddmmyyyyStr.slice(6, 10);
  const d = Number(dd), m = Number(mm), y = Number(yyyy);
  if (d < 1 || d > 31 || m < 1 || m > 12 || y < 1900 || y > 2100) return '';
  return `${yyyy}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function isoToDisplay(isoDate) {
  if (!isoDate) return '';
  const iso = toISODate(isoDate);
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
/* ----- Reusable dd/mm/yyyy text field + real calendar picker button ----- */
function dateFieldHtml(id, isoValue, extraAttrs) {
  return `<div class="date-field">
    <input type="text" placeholder="dd/mm/yyyy" id="${id}" value="${esc(isoToDisplay(isoValue))}" inputmode="numeric" ${extraAttrs || ''}>
    <button type="button" class="date-pick-btn" onclick="openNativeDatePicker('${id}')" title="Pick a date" aria-label="Pick a date">📅</button>
  </div>`;
}
function openNativeDatePicker(targetId) {
  const target = document.getElementById(targetId);
  const nd = document.getElementById('native-date-picker');
  if (!target || !nd) return;
  // Position the (invisible) native date input directly over the visible
  // text field before opening it. The browser's calendar popup anchors
  // itself to the input's on-screen position — leaving it parked at
  // (-9999px, -9999px) meant the popup opened far off-screen and looked
  // like nothing happened at all.
  const rect = target.getBoundingClientRect();
  nd.style.position = 'fixed';
  nd.style.left = rect.left + 'px';
  nd.style.top = rect.top + 'px';
  nd.style.width = rect.width + 'px';
  nd.style.height = rect.height + 'px';
  nd.value = parseDateInput(target.value.trim()) || toISODate(target.value.trim()) || '';
  nd.onchange = () => {
    if (!nd.value) return;
    target.value = isoToDisplay(nd.value);
    target.dispatchEvent(new Event('input', { bubbles: true }));
    target.dispatchEvent(new Event('change', { bubbles: true }));
  };
  if (nd.showPicker) { try { nd.showPicker(); return; } catch (e) {} }
  nd.focus();
  nd.click();
}
function monthLabel(ym) {
  const [y, m] = ym.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
}
function uid() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ----- PIN security helpers (hashing + brute-force lockout) ----- */
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const WEAK_PINS = ['12345678', '87654321', '11111111', '00000000', 'password', 'passw0rd', 'qwertyui', 'abcdefgh', '173946', 'letmein1'];
function pinStrengthError(pin) {
  if (!pin || pin.length < 8) return 'PIN must be at least 8 characters';
  if (/^(.)\1+$/.test(pin)) return 'PIN can\'t be the same character repeated';
  if (WEAK_PINS.includes(pin.toLowerCase())) return 'That PIN is too common — choose something less guessable';
  const hasLetter = /[a-zA-Z]/.test(pin), hasNumber = /[0-9]/.test(pin);
  if (!(hasLetter && hasNumber)) return 'Mix letters and numbers for a stronger PIN';
  return null;
}
const PIN_LOCK_KEY = 'ds_pin_lock';
function getPinLockState() {
  try { return JSON.parse(localStorage.getItem(PIN_LOCK_KEY) || '{}'); } catch (e) { return {}; }
}
function setPinLockState(s) { try { localStorage.setItem(PIN_LOCK_KEY, JSON.stringify(s)); } catch (e) {} }
function pinLockRemainingMs() {
  const s = getPinLockState();
  if (!s.lockUntil) return 0;
  return Math.max(0, s.lockUntil - Date.now());
}
function registerPinFailure() {
  const s = getPinLockState();
  const fails = (s.fails || 0) + 1;
  let lockUntil = s.lockUntil || 0;
  if (fails >= 5) {
    const lockMinutes = Math.min(30, Math.pow(2, fails - 5)); // 1,2,4,8,16,30... minutes
    lockUntil = Date.now() + lockMinutes * 60 * 1000;
  }
  setPinLockState({ fails, lockUntil });
}
function clearPinFailures() { setPinLockState({ fails: 0, lockUntil: 0 }); }

/* Migrate older single-model sales records into the multi-model items structure */
function normalizeSalesEntry(e) {
  const discount = Number(e.discount) || 0;
  const advance = Number(e.advance) || 0;
  const due = e.due != null ? Number(e.due) : (Number(e.totalPrice) || 0) - advance;
  if (e.items && e.items.length) {
    return { ...e, orderNumber: e.orderNumber || '', customerComment: e.customerComment || '', discount, advance, due, quantity: e.items.reduce((s, it) => s + (Number(it.quantity) || 0), 0) };
  }
  const quantity = Number(e.quantity) || 0;
  const unitPrice = Number(e.unitPrice) || 0;
  return {
    ...e,
    orderNumber: e.orderNumber || '',
    customerComment: e.customerComment || '',
    discount, advance, due,
    items: [{ model: e.model || '', description: e.description || '', quantity, unitPrice, lineTotal: quantity * unitPrice }],
    quantity
  };
}

/* ===================== Filtering (ie / re) ===================== */
function periodBounds(f) {
  if (f.periodMode === 'month') {
    if (f.month === 'All') return { start: '0000-01-01', end: '9999-12-31' };
    const [y, m] = f.month.split('-').map(Number);
    const start = `${y}-${String(m).padStart(2, '0')}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    const end = `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
    return { start, end };
  }
  if (f.periodMode === 'date' && f.dateMode === 'single') {
    const d = f.singleDate || '';
    if (!d) return { start: '0000-01-01', end: '9999-12-31' };
    return { start: d, end: d };
  }
  return { start: f.dateFrom || '0000-01-01', end: f.dateTo || '9999-12-31' };
}
function matchesFilters(e, f) {
  if (f.type !== 'All' && e.type !== f.type) return false;
  if (f.categories.length > 0 && !f.categories.includes(e.category)) return false;
  if (f.particular !== 'All' && e.particular !== f.particular) return false;
  const { start, end } = periodBounds(f);
  if (e.date < start || e.date > end) return false;
  return true;
}
function matchesSalesFilters(e, f) {
  if (f.channel !== 'All' && e.channel !== f.channel) return false;
  if (f.model !== 'All' && !(e.items || []).some(it => it.model === f.model)) return false;
  if (f.district !== 'All' && e.district !== f.district) return false;
  if (f.status !== 'All' && e.status !== f.status) return false;
  if (f.paymentMethod !== 'All' && e.paymentMethod !== f.paymentMethod) return false;
  const { start, end } = periodBounds(f);
  if (e.date < start || e.date > end) return false;
  return true;
}
function getFiltered() {
  const book = state.book, f = state.filters[book];
  const list = state.entries[book];
  const fn = book === 'sales' ? matchesSalesFilters : matchesFilters;
  return list.filter(e => fn(e, f)).sort((a, b) => a.date.localeCompare(b.date));
}
function getOpeningBalance() {
  const book = state.book;
  if (book === 'sales') return 0;
  const f = state.filters[book];
  const { start } = periodBounds(f);
  let bal = 0;
  state.entries[book].forEach(e => {
    if (f.type !== 'All' && e.type !== f.type) return;
    if (f.categories.length > 0 && !f.categories.includes(e.category)) return;
    if (f.particular !== 'All' && e.particular !== f.particular) return;
    if (e.date < start) bal += (e.type === CREDIT_TYPE[book] ? Number(e.amount) : -Number(e.amount));
  });
  return bal;
}
function availableMonths() {
  const book = state.book;
  const set = new Set(state.entries[book].map(e => (e.date || '').slice(0, 7)).filter(Boolean));
  return Array.from(set).sort();
}

function matchesDashboardBookFilter(e, f) {
  if (f.type !== 'All' && e.type !== f.type) return false;
  if (f.categories.length > 0 && !f.categories.includes(e.category)) return false;
  if (f.particular !== 'All' && e.particular !== f.particular) return false;
  return true;
}
function matchesDashboardSalesFilter(e, f) {
  if (f.channel !== 'All' && e.channel !== f.channel) return false;
  if (f.model !== 'All' && !(e.items || []).some(it => it.model === f.model)) return false;
  if (f.district !== 'All' && e.district !== f.district) return false;
  if (f.status !== 'All' && e.status !== f.status) return false;
  return true;
}
function dashboardMetrics() {
  // Company accounting = Sales + Income-Expense only. Received-Expense is a
  // separate, personal ledger and does not affect these totals.
  const ieF = state.dashboardFilters.ie, salesF = state.dashboardFilters.sales;
  const ie = state.entries.ie.filter(e => inDashboardRange(e.date) && matchesDashboardBookFilter(e, ieF));
  const sales = state.entries.sales.filter(e => inDashboardRange(e.date) && matchesDashboardSalesFilter(e, salesF));

  // Cancelled & returned orders never actually became revenue, so they're kept
  // out of Total Sales — otherwise the dashboard overstates income. Their value
  // is still surfaced separately (cancelledSales) so it isn't just invisible;
  // any real cost from the cancellation/return (courier charge, damage, etc.)
  // should be logged as an "Order Cancellation/Return Cost" expense in the
  // Income–Expense book, which then flows into Total Expense / Available
  // Balance like any other expense.
  const completedSales = sales.filter(r => r.status !== 'Cancelled & Returned');
  const cancelledOrders = sales.filter(r => r.status === 'Cancelled & Returned');
  const totalSales = completedSales.reduce((s, r) => s + (Number(r.totalPrice) || 0), 0);
  const cancelledSales = cancelledOrders.reduce((s, r) => s + (Number(r.totalPrice) || 0), 0);

  const sumByCategories = (cats) => ie.filter(e => cats.includes(e.category)).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const cogs = sumByCategories(['Raw Materials']);
  const totalPurchase = sumByCategories(['Raw Materials', 'Machine/ Equipment/ Stationary']);
  const cancellationCost = sumByCategories(['Order Cancellation/Return Cost']);

  const totalCredit = ie.filter(e => e.type === CREDIT_TYPE.ie).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalDebit = ie.filter(e => e.type === DEBIT_TYPE.ie).reduce((s, e) => s + (Number(e.amount) || 0), 0);

  return {
    totalSales, cogs, totalPurchase, cancelledSales, cancelledOrderCount: cancelledOrders.length, cancellationCost,
    totalExpense: totalDebit,
    totalCredit, totalDebit,
    availableBalance: totalCredit - totalDebit
  };
}
function reSummaryMetrics() {
  const reF = state.dashboardFilters.re;
  const re = state.entries.re.filter(e => inDashboardRange(e.date) && matchesDashboardBookFilter(e, reF));
  const received = re.filter(e => e.type === CREDIT_TYPE.re).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const expense = re.filter(e => e.type === DEBIT_TYPE.re).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  return { received, expense, balance: received - expense };
}

/* ----- Dashboard: Received-Expense particular-wise (দেনা-পাওনা) breakdown ----- */
function dashboardReParticularRows() {
  const reF = state.dashboardFilters.re;
  const filtered = state.entries.re.filter(e => inDashboardRange(e.date) && matchesDashboardBookFilter(e, reF));
  const map = {};
  filtered.forEach(e => {
    const name = e.particular || '—';
    if (!map[name]) map[name] = { name, received: 0, expense: 0 };
    if (e.type === CREDIT_TYPE.re) map[name].received += Number(e.amount) || 0;
    else map[name].expense += Number(e.amount) || 0;
  });
  return Object.values(map)
    .map(r => ({ ...r, balance: r.received - r.expense }))
    .sort((a, b) => (b.received + b.expense) - (a.received + a.expense));
}

function getAllVouchersRaw() {
  const allVouchers = [];
  ['ie', 're', 'sales'].forEach(book => {
    state.entries[book].forEach(entry => {
      if (entry.voucher) {
        allVouchers.push({
          id: entry.id, book, date: entry.date,
          category: entry.category || '',
          particular: book === 'sales' ? (entry.customer || '') : (entry.particular || ''),
          label: book === 'sales'
            ? `${entry.orderNumber || 'Order'} — ${entry.customer}`
            : `${entry.date} · ${entry.category}${entry.particular ? ' · ' + entry.particular : ''}`,
          voucher: entry.voucher
        });
      }
    });
  });
  return allVouchers.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
function getFilteredVouchers() {
  const f = state.voucherFilters;
  return getAllVouchersRaw().filter(v => {
    if (f.book && f.book !== 'All' && v.book !== f.book) return false;
    if (f.particular && f.particular !== 'All' && v.particular !== f.particular) return false;
    if (f.from && v.date < f.from) return false;
    if (f.to && v.date > f.to) return false;
    return true;
  });
}

function dataUrlImageFormat(dataUrl) {
  const m = /^data:image\/(\w+);/.exec(dataUrl || '');
  const t = m ? m[1].toLowerCase() : '';
  if (t === 'png') return 'PNG';
  if (t === 'webp') return 'WEBP';
  return 'JPEG';
}
function loadImageDims(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 });
    img.onerror = () => resolve({ w: 1, h: 1 });
    img.src = src;
  });
}
async function downloadVouchersPDF() {
  const raw = getAllVouchersRaw();
  const vouchers = state.voucherSelection.length
    ? raw.filter(v => state.voucherSelection.includes(v.id))
    : getFilteredVouchers();
  if (!vouchers.length) { showToast('ডাউনলোড করার মত কোনো ভাউচার নেই'); return; }
  try {
    await ensureJsPDF();
  } catch (e) {
    showToast('PDF tool could not load — please try again');
    return;
  }
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const marginX = 36, headerY = 40, imageTop = 76, marginBottom = 40;
    const maxW = pageWidth - marginX * 2;
    const maxH = pageHeight - imageTop - marginBottom;

    for (let i = 0; i < vouchers.length; i++) {
      const v = vouchers[i];
      if (i > 0) doc.addPage();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
      doc.text('Deluxe Seat — Voucher', marginX, headerY);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      doc.text(v.label, marginX, headerY + 16, { maxWidth: maxW });

      const dims = await loadImageDims(v.voucher);
      const scale = Math.min(maxW / dims.w, maxH / dims.h, 1);
      const w = dims.w * scale, h = dims.h * scale;
      const x = marginX + (maxW - w) / 2;
      try { doc.addImage(v.voucher, dataUrlImageFormat(v.voucher), x, imageTop, w, h); } catch (e) { /* skip a broken image, keep the rest of the PDF */ }
    }
    doc.save(`Deluxe-Seat-Vouchers-${Date.now()}.pdf`);
  } catch (e) {
    showToast('Could not build the PDF — please try again');
  }
}

/* ----- Robust print helper -----
   Setting #print-area's content and immediately calling window.print()
   can race ahead of the browser's layout/paint pass — especially in
   mobile browsers and in-app webviews — which is what was causing
   printed pages and downloaded PDFs to come out blank. We wait two
   animation frames (guaranteeing the new content has actually been
   laid out and painted) before opening the print dialog, and we only
   clear the print area afterwards once the browser confirms printing
   is done (the 'afterprint' event), with a generous fallback timer in
   case that event doesn't fire on a particular device. */
function firePrint(html, afterDone) {
  document.getElementById('print-area').innerHTML = html;
  let done = false;
  const fallback = setTimeout(finish, 3000);
  function finish() {
    if (done) return;
    done = true;
    window.removeEventListener('afterprint', finish);
    clearTimeout(fallback);
    if (afterDone) afterDone();
  }
  window.addEventListener('afterprint', finish);
  requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
}
function printParticularDetail() {

        <tr><th>Date</th><th>Type</th><th>Category</th><th class="num">Amount</th><th>Remarks</th></tr>

}

function renderAllSummaryMonth(m) {
  const book = state.book;
  const rows = state.entries[book].filter(e => (e.date || '').slice(0, 7) === m);
  const credit = rows.filter(e => e.type === CREDIT_TYPE[book]);
  const debit = rows.filter(e => e.type === DEBIT_TYPE[book]);
  const totalIn = credit.reduce((s, e) => s + Number(e.amount), 0);
  const totalOut = debit.reduce((s, e) => s + Number(e.amount), 0);
  const net = totalIn - totalOut;
  const expanded = state.ui.allSummaryMonth === m;
  const inLabel = book === 'ie' ? 'Income' : 'Received';

  const catIn = groupBySum(credit, 'category', 'amount');
  const catOut = groupBySum(debit, 'category', 'amount');
  const partIn = groupBySum(credit, 'particular', 'amount');
  const partOut = groupBySum(debit, 'particular', 'amount');

  const listBlock = (title, rowsList) => `
    <div>
      <div class="section-title" style="font-size:12.5px;margin:12px 0 6px;">${title}</div>
      <div class="cat-breakdown">

    </div>`;

  return `
  <div class="item-card" style="margin-bottom:10px;">
    <div class="item-card-head" style="cursor:pointer;" onclick="setAllSummaryMonth('${m}')">
      <span>${monthLabel(m)}</span>

    </div>
    <div class="ledger-bottom" style="margin-bottom:${expanded ? '10px' : '0'};">
      <span class="ledger-amt credit">+${money(totalIn)}</span>
      <span class="ledger-amt debit">−${money(totalOut)}</span>
      <span class="ledger-bal">Net: ${money(net)}</span>
    </div>
    ${expanded ? `
      <div class="two-col-breakdown">
        ${listBlock(inLabel + ' by category', catIn)}
        ${listBlock('Expense by category', catOut)}
      </div>
      <div class="two-col-breakdown">
        ${listBlock(inLabel + ' by particular', partIn)}
        ${listBlock('Expense by particular', partOut)}
      </div>
    ` : ''}
  </div>`;
}

function buildLedgerRows(list, opening) {

    return { ...e, isCredit, running };
  });

function countBy(list, key) {
  const map = {};
  list.forEach(e => { const k = e[key] || '—'; map[k] = (map[k] || 0) + 1; });
  return Object.entries(map).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
}

/* Pulls whatever is currently typed in the open sales form into salesFormDraft,
   so values survive re-renders triggered by adding/removing a model row. */
function syncSalesFormDraft() {
  if (!salesFormDraft) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const grabDate = (key, id) => { const v = val(id); if (v !== undefined) { const parsed = parseDateInput(v.trim()); salesFormDraft[key] = parsed || v; } };
  const grab = (key, id) => { const v = val(id); if (v !== undefined) salesFormDraft[key] = v; };
  grabDate('date', 's-date'); grab('orderNumber', 's-orderNumber'); grab('channel', 's-channel');
  grab('customer', 's-customer'); grab('mobile', 's-mobile'); grab('thana', 's-thana'); grab('district', 's-district');
  grab('deliveryMethod', 's-deliveryMethod'); grab('sfId', 's-sfId'); grab('paymentMethod', 's-paymentMethod');
  grab('deliveryCost', 's-deliveryCost'); grab('codCharge', 's-codCharge');
  grab('discount', 's-discount'); grab('advance', 's-advance');
  grabDate('bookingDate', 's-bookingDate'); grabDate('deliveryDate', 's-deliveryDate'); grabDate('sfWithdrawalDate', 's-sfWithdrawalDate');
  grab('status', 's-status'); grab('customerComment', 's-customerComment');
  salesFormDraft.items = salesFormDraft.items.map((it, i) => ({
    model: val(`si-model-${i}`) ?? it.model,
    description: val(`si-desc-${i}`) ?? it.description,
    quantity: val(`si-qty-${i}`) ?? it.quantity,
    unitPrice: val(`si-price-${i}`) ?? it.unitPrice
  }));
}

/* Distinct list of the "particular" names used for Investment entries in
   Income-Expense — these are the 12 DS Family / investor names, kept
   in sync with the PARTICULARS list (plus any custom ones added later)
   so this dropdown never drifts from that list. */
function dsFamilyNames() {
  return Array.from(new Set([...PARTICULARS, ...(state.customLists.particulars || [])])).sort();

/* Auto-fill name/price from the product catalog when a model number is picked */
function onModelSelect(i) {
  syncSalesFormDraft();

  if (p) {
    salesFormDraft.items[i].description = p.name || salesFormDraft.items[i].description;
    if (p.price) salesFormDraft.items[i].unitPrice = p.price;
  }
  render();
}

/* Pulls whatever is currently typed in the open Add/Edit entry form into draftFields,
   so values survive re-renders triggered by switching Received/Expense, category, etc. */
function syncEntryFormDraft() {
  if (!state.ui.addModalOpen) return;
  if (!draftFields) draftFields = {};
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const grab = (key, id) => { const v = val(id); if (v !== undefined) draftFields[key] = v; };
  grab('date', 'f-date'); grab('particular', 'f-particular'); grab('counterparty', 'f-counterparty');
  grab('amount', 'f-amount'); grab('remarks', 'f-remarks');
}

function onExpenseModeChange(v) { syncEntryFormDraft(); draftExpenseMode = v; render(); }
function onCategoryChange(v, type) {
  if (v === '__add_new__') { openQuickAdd('category', type); return; }
  syncEntryFormDraft(); draftCategory = v; render();
}
function onPurposeChange(v) {
  if (v === '__add_new__') { openQuickAdd('purpose'); return; }
  syncEntryFormDraft(); draftPurpose = v; render();

function openQuickAdd(kind, type) {
  syncEntryFormDraft();
  state.ui.quickAdd = { kind, type: type || null };
  render();
  setTimeout(() => { const el = document.getElementById('quick-add-input'); if (el) el.focus(); }, 0);

function closeQuickAdd() { state.ui.quickAdd = null; render(); }
async function submitQuickAdd() {
  const qa = state.ui.quickAdd;
  if (!qa) return;
  const el = document.getElementById('quick-add-input');
  const val = el ? el.value.trim() : '';
  if (!val) { showToast('Type a name first'); return; }
  const book = state.book;
  if (qa.kind === 'category') {
    const isCredit = qa.type === CREDIT_TYPE[book];
    const key = isCredit ? 'incomeCategories' : 'expenseCategories';
    if (!state.customLists[key].includes(val)) state.customLists[key].push(val);
    await persistCustomLists();
    draftCategory = val;
  } else if (qa.kind === 'purpose') {
    if (!state.customLists.purposes.includes(val)) state.customLists.purposes.push(val);
    await persistCustomLists();
    draftPurpose = val;
  } else if (qa.kind === 'particular') {
    if (!state.customLists.particulars.includes(val)) state.customLists.particulars.push(val);
    await persistCustomLists();
  }
  state.ui.quickAdd = null;
  render();
  showToast('Added — you can use it from now on');
}

function triggerVoucherUpload() { document.getElementById('voucher-image-input').click(); }
function handleVoucherUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Downscale + compress so many voucher photos don't blow past storage limits
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const scale = maxDim / Math.max(w, h);
        w = Math.round(w * scale); h = Math.round(h * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      draftVoucher = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.onerror = () => { draftVoucher = e.target.result; render(); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeVoucherImage() { draftVoucher = null; render(); }

async function saveEntry() {
  const book = state.book;
  const dateInput = parseDateInput(document.getElementById('f-date').value.trim());
  if (!dateInput) { showToast('Invalid date — use dd/mm/yyyy format'); return; }
  const date = dateInput;
  const categoryEl = document.getElementById('f-category');
  const category = categoryEl ? categoryEl.value : '';
  const purposeEl = document.getElementById('f-purpose');
  const purpose = purposeEl ? purposeEl.value : '';
  const particular = document.getElementById('f-particular').value.trim();
  const counterpartyEl = document.getElementById('f-counterparty');
  const counterparty = counterpartyEl ? counterpartyEl.value.trim() : '';
  const expenseModeEl = document.getElementById('f-expense-mode');
  const expenseMode = expenseModeEl ? expenseModeEl.value : '';
  const amount = parseFloat(document.getElementById('f-amount').value);
  const remarks = document.getElementById('f-remarks').value.trim();
  const type = draftType || CREDIT_TYPE[book];

  if (!date || !category || !amount || isNaN(amount)) { showToast('Please fill date, category and a valid amount'); return; }

  const wasEditing = !!state.ui.editingId;
  if (wasEditing) {
    const e = state.entries[book].find(e => e.id === state.ui.editingId);
    const voucher = draftVoucher !== undefined ? (draftVoucher || '') : (e.voucher || '');
    Object.assign(e, { date, type, category, purpose, particular, counterparty, expenseMode, amount, remarks, voucher });
  } else {
    const voucher = draftVoucher || '';
    state.entries[book].push({ id: uid(), date, type, category, purpose, particular, counterparty, expenseMode, amount, remarks, voucher });
  }
  const ok = await persist(book);
  if (!ok) { render(); return; } // sync failed — keep the modal open and the entry pending so nothing looks "saved" when it wasn't
  state.ui.addModalOpen = false; state.ui.editingId = null; draftType = null; draftCategory = null; draftPurpose = null; draftExpenseMode = null; draftVoucher = undefined; draftFields = null;
  render();
  showToast(wasEditing ? 'Entry updated' : 'Entry added');
}

async function saveSalesEntry() {
  syncSalesFormDraft();
  const d = salesFormDraft;
  const date = d.date;
  const customer = (d.customer || '').trim();
  if (!date || !customer) { showToast('Please fill date and customer'); return; }

  const items = [];
  for (const it of d.items) {
    const model = it.model;
    const quantityStr = String(it.quantity ?? '').trim();
    const unitPriceStr = String(it.unitPrice ?? '').trim();
    const isEmptyRow = !model && !quantityStr && !unitPriceStr && !it.description;
    if (isEmptyRow) continue;
    const quantity = parseFloat(quantityStr);
    const unitPrice = parseFloat(unitPriceStr);
    if (!model || isNaN(quantity) || isNaN(unitPrice)) {
      showToast('Please fill model, quantity and unit price for every model row');
      return;
    }
    items.push({
      model, description: it.description || '',
      quantity, unitPrice, lineTotal: quantity * unitPrice
    });
  }
  if (items.length === 0) { showToast('Please add at least one model'); return; }

  const deliveryCost = parseFloat(d.deliveryCost) || 0;
  const codCharge = parseFloat(d.codCharge) || 0;
  const discount = parseFloat(d.discount) || 0;
  const advance = parseFloat(d.advance) || 0;
  const itemsTotal = items.reduce((s, it) => s + it.lineTotal, 0);
  const totalPrice = itemsTotal + deliveryCost + codCharge - discount;
  const due = totalPrice - advance;
  const quantity = items.reduce((s, it) => s + it.quantity, 0);

  const payload = {
    date, channel: d.channel, orderNumber: d.orderNumber || '',
    customer, mobile: d.mobile, thana: d.thana, district: d.district,
    deliveryMethod: d.deliveryMethod, sfId: d.sfId, paymentMethod: d.paymentMethod,
    items, quantity, deliveryCost, codCharge, discount, advance, totalPrice, due, customerComment: d.customerComment || '',
    bookingDate: d.bookingDate, deliveryDate: d.deliveryDate, sfWithdrawalDate: d.sfWithdrawalDate,
    status: d.status
  };

  const wasEditing = !!state.ui.editingId;
  let oldItems = null;
  if (wasEditing) {
    const e = state.entries.sales.find(e => e.id === state.ui.editingId);
    oldItems = e.items ? e.items.slice() : [];
    Object.assign(e, payload);
  } else {
    state.entries.sales.push({ id: uid(), ...payload });
  }
  const ok = await persist('sales');
  if (!ok) { render(); return; }
  if (oldItems) adjustStockForItems(oldItems, 1); // restore stock for the order's previous quantities
  adjustStockForItems(items, -1); // deduct stock for the (new) quantities actually sold
  await persistProducts();
  state.ui.addModalOpen = false; state.ui.editingId = null; salesFormDraft = null;
  render();
  showToast(wasEditing ? 'Order updated' : 'Order added');
}

async function deleteEntry(id) {
  if (!state.editMode) return;
  const book = state.book;
  if (!confirm('Delete this entry?')) return;
  const backup = state.entries[book];
  const deletedEntry = state.entries[book].find(e => e.id === id);
  state.entries[book] = state.entries[book].filter(e => e.id !== id);
  const ok = await persist(book);
  if (!ok) { state.entries[book] = backup; render(); return; } // sync failed — restore so the entry doesn't vanish only locally
  if (book === 'sales' && deletedEntry && deletedEntry.items) {
    adjustStockForItems(deletedEntry.items, 1); // order removed — give the stock back
    await persistProducts();
  }
  render();
  showToast('Entry deleted');
}

function ensureJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if (window.__jspdfLoading) return window.__jspdfLoading;
  window.__jspdfLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => resolve();
    s.onerror = () => { window.__jspdfLoading = null; reject(new Error('load-failed')); };
    document.head.appendChild(s);
  });
  return window.__jspdfLoading;
}
async function downloadReceiptPDF() {
  const book = state.book;
  const r = state.entries[book].find(e => e.id === state.ui.receiptId);
  if (!r) return;
  try {
    await ensureJsPDF();
  } catch (e) {
    showToast('PDF tool could not load — printing instead (use "Save as PDF" in the print dialog)');
    printReceipt();
    return;
  }
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a5' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 40, valueX = pageWidth - 40;
    let y = 46;

    const container = document.querySelector('#receipt-content .receipt');
    const sub = (container && container.querySelector('.receipt-sub') && container.querySelector('.receipt-sub').textContent) || '';

    const iconW = 22, iconH = iconW * (70 / 130);
    try { doc.addImage(LOGO_ICON, 'PNG', marginX, y - 16, iconW, iconH); } catch (e) { /* fall back to text-only header if image fails */ }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('Deluxe Seat', marginX + iconW + 8, y - 16 + iconH - 3);
    y += 12;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    doc.text(sub, marginX, y); y += 14;
    doc.setDrawColor(180); doc.line(marginX, y, valueX, y); y += 18;

    const rows = container ? Array.from(container.querySelectorAll('table tr')) : [];
    doc.setFontSize(10.5);
    rows.forEach(tr => {
      if (y > 760) { doc.addPage(); y = 46; }
      const tds = tr.querySelectorAll(':scope > td');
      const isItemRow = tds.length === 1 && tds[0].hasAttribute('colspan');
      if (isItemRow) {
        const divs = tds[0].querySelectorAll('div');
        doc.setFont('helvetica', 'normal');
        divs.forEach(d => {
          const lines = doc.splitTextToSize(d.textContent.trim(), (valueX - marginX));
          lines.forEach(line => { doc.text(line, marginX, y); y += 14; });
        });
        y += 4;
      } else if (tds.length === 2) {
        const label = tds[0].textContent.trim();
        const value = tds[1].textContent.trim();
        const isTotal = tr.className.indexOf('total') !== -1;
        doc.setFont('helvetica', isTotal ? 'bold' : 'normal');
        doc.text(label, marginX, y);
        doc.text(value, valueX, y, { align: 'right' });
        y += 16;
        if (isTotal) { doc.setDrawColor(180); doc.line(marginX, y - 12, valueX, y - 12); }
      }
    });

    const filename = `Deluxe-Seat-${esc(BOOK_LABEL[book] || 'Receipt').replace(/[^a-z0-9]+/gi, '-')}-${r.date || ''}.pdf`;
    doc.save(filename);
  } catch (e) {
    showToast('Could not build the PDF — please try again');
  }
}

  const inLabel = book === 'ie' ? 'Total Income' : 'Total Received';
  const creditType = CREDIT_TYPE[book], debitType = DEBIT_TYPE[book];
  const opening = getOpeningBalance();
  const totalIn = filtered.filter(e => e.type === creditType).reduce((s, e) => s + Number(e.amount), 0);

function pdfMoney(n) {
  const v = Number(n) || 0;
  return 'Tk ' + v.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function pdfTruncate(doc, text, maxWidth) {
  text = text == null ? '' : String(text);
  if (!text) return '';
  if (doc.getTextWidth(text) <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && doc.getTextWidth(t + '…') > maxWidth) t = t.slice(0, -1);
  return t + '…';
}
function drawPdfTable(doc, columns, rows, opts) {
  opts = opts || {};
  const marginX = opts.marginX || 30;
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const rightEdge = pageWidth - marginX;
  const rowH = 15;
  let y = opts.startY || 60;

  function drawHeaderRow() {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    let x = marginX;
    columns.forEach(c => {
      if (c.align === 'right') doc.text(c.label, x + c.width - 4, y, { align: 'right' });
      else doc.text(c.label, x, y);
      x += c.width;
    });
    y += 6;
    doc.setDrawColor(170);
    doc.line(marginX, y, rightEdge, y);
    y += 12;
  }

  drawHeaderRow();
  doc.setFontSize(8.5);
  rows.forEach(row => {
    if (y > pageHeight - 44) {
      doc.addPage();
      y = 44;
      drawHeaderRow();
      doc.setFontSize(8.5);
    }
    if (row.__blank) { y += rowH * 0.55; return; }
    if (row.__section) {
      doc.setFont('helvetica', 'bold');
      doc.text(pdfTruncate(doc, row.__section, rightEdge - marginX), marginX, y);
      y += rowH;
      return;
    }
    if (row.__total) {
      doc.setFont('helvetica', 'bold');
      doc.text(pdfTruncate(doc, row.__total.label, rightEdge - marginX - 130), marginX, y);
      if (row.__total.amount) doc.text(String(row.__total.amount), rightEdge, y, { align: 'right' });
      y += rowH;
      return;
    }
    doc.setFont('helvetica', row.__bold ? 'bold' : 'normal');
    let x = marginX;
    columns.forEach(c => {
      const text = pdfTruncate(doc, row[c.key], c.width - 6);
      if (c.align === 'right') doc.text(text, x + c.width - 4, y, { align: 'right' });
      else doc.text(text, x, y);
      x += c.width;
    });
    y += rowH;
  });
}

function handleUpload(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const book = state.book;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      const imported = mapImportedRows(book, rows);
      if (imported.length === 0) { showToast('No matching rows found in that file'); return; }
      state.entries[book].push(...imported);
      const ok = await persist(book);
      render();
      if (ok) showToast(`Imported ${imported.length} row(s)`);
    } catch (err) {
      showToast('Could not read that file');
    }
  };
  reader.readAsArrayBuffer(file);
  ev.target.value = '';
}
function toISODate(v) {
  if (v instanceof Date) { if (isNaN(v)) return ''; return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`; }
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d) ? '' : d.toISOString().slice(0, 10); }
  const s = String(v || '').trim();
  if (!s) return '';
  // Already ISO (yyyy-mm-dd) — validate and normalize padding.
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) {
    const y = +m[1], mo = +m[2], da = +m[3];
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
  }
  // dd/mm/yyyy, dd-mm-yyyy or dd.mm.yyyy — treated as day-first to match this app's own
  // display format (dd/mm/yyyy) instead of the ambiguous, locale-dependent native Date parser.
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) {
    const dd = +m[1], mm2 = +m[2], yyyy = +m[3];
    if (mm2 >= 1 && mm2 <= 12 && dd >= 1 && dd <= 31) return `${yyyy}-${String(mm2).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
  }
  // Fallback for anything else (e.g. "4 Aug 2026") — let the browser try.
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function pick(row, names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const k = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === n.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (k) return row[k];
  }
  return '';
}
function mapImportedRows(book, rows) {
  if (book === 'sales') {
    return rows.filter(r => pick(r, ['Order Date', 'Date'])).map(r => {
      const quantity = Number(pick(r, ['Quantity'])) || 0;
      const unitPrice = Number(pick(r, ['Unit Price'])) || 0;
      const deliveryCost = Number(pick(r, ['Delivery Cost'])) || 0;
      const codCharge = Number(pick(r, ['COD Charge'])) || 0;
      const discount = Number(pick(r, ['Discount'])) || 0;
      const advance = Number(pick(r, ['Advance'])) || 0;
      const lineTotal = quantity * unitPrice;
      const totalPrice = lineTotal + deliveryCost + codCharge - discount;
      return {
        id: uid(),
        date: toISODate(pick(r, ['Order Date', 'Date'])),
        orderNumber: pick(r, ['Order Number', 'Order No', 'OrderNo']),
        channel: pick(r, ['Channel']),
        items: [{
          model: pick(r, ['Model']), description: pick(r, ['Description']),
          quantity, unitPrice, lineTotal
        }],
        customer: pick(r, ['Customer Name', 'Customer']), mobile: String(pick(r, ['Mobile Number', 'Mobile'])),
        thana: pick(r, ['Thana']), district: pick(r, ['District']),
        deliveryMethod: pick(r, ['Delivery Method']), sfId: pick(r, ['SF ID']),
        paymentMethod: pick(r, ['Payment Method']), quantity, deliveryCost, codCharge, discount, advance,
        customerComment: pick(r, ['Customer Comment', 'Customer Remark', "Customer's Remark", 'Remark']),
        totalPrice, due: totalPrice - advance,
        bookingDate: toISODate(pick(r, ['Booking Date'])), deliveryDate: toISODate(pick(r, ['Delivery Date'])),
        sfWithdrawalDate: toISODate(pick(r, ['SF Withdrawal Date'])), status: pick(r, ['Status'])
      };
    });
  }
  return rows.filter(r => pick(r, ['Date'])).map(r => ({
    id: uid(),
    date: toISODate(pick(r, ['Date'])),
    type: pick(r, ['Type', 'Income/Expenses']) || CREDIT_TYPE[book],
    category: pick(r, ['Category']),
    purpose: pick(r, ['Purpose']),
    particular: pick(r, ['Particular']),
    counterparty: pick(r, ['Counterparty', 'Received From', 'Expense To', 'Forwarded To']),
    amount: Number(pick(r, ['Amount'])) || 0,
    remarks: pick(r, ['Remarks'])
  }));
}

const BULK_COLS = ['date', 'type', 'category', 'purpose', 'particular', 'counterparty', 'amount', 'remarks'];
function blankBulkRow() { return { date: '', type: '', category: '', purpose: '', particular: '', counterparty: '', amount: '', remarks: '' }; }
function normalizeBulkType(book, raw) {
  const s = String(raw || '').trim().toLowerCase();
  if (!s) return '';
  if (s.startsWith('inc') || s.startsWith('rec') || s === 'credit' || s === 'cr') return CREDIT_TYPE[book];
  if (s.startsWith('exp') || s === 'debit' || s === 'dr') return DEBIT_TYPE[book];
  return raw;
}
function openBulkAddModal() {

function syncBulkDraft() {
  bulkRows = bulkRows.map((row, i) => {
    const next = { ...row };
    BULK_COLS.forEach(col => {
      const el = document.getElementById(`b-${col}-${i}`);
      if (el) next[col] = el.value;
    });
    return next;
  });
}
function addBulkRow() { syncBulkDraft(); bulkRows.push(blankBulkRow()); render(); }
function removeBulkRow(i) { syncBulkDraft(); bulkRows.splice(i, 1); render(); }
function handleBulkPaste(ev, rowIndex, colIndex) {
  const cd = ev.clipboardData || window.clipboardData;
  const text = cd ? cd.getData('text') : '';
  if (!text) return;
  const lines = text.replace(/\r/g, '').split('\n').filter((ln, i, arr) => !(i === arr.length - 1 && ln === ''));
  const isMulti = lines.length > 1 || lines[0].indexOf('\t') !== -1;
  if (!isMulti) return;
  ev.preventDefault();
  syncBulkDraft();
  lines.forEach((line, r) => {
    const cells = line.split('\t');
    const targetRow = rowIndex + r;
    while (bulkRows.length <= targetRow) bulkRows.push(blankBulkRow());
    cells.forEach((val, c) => {
      const col = BULK_COLS[colIndex + c];
      if (!col) return;
      bulkRows[targetRow][col] = String(val).trim();
    });
  });
  render();
  showToast(`Pasted ${lines.length} row${lines.length === 1 ? '' : 's'}`);
}

}

let productPasteHint = false;
function handleProductPaste(ev, rowIndex, colIndex) {
  const cd = ev.clipboardData || window.clipboardData;
  const text = cd ? cd.getData('text') : '';
  if (!text) return;
  const lines = text.replace(/\r/g, '').split('\n').filter((ln, i, arr) => !(i === arr.length - 1 && ln === ''));
  const isMulti = lines.length > 1 || lines[0].indexOf('\t') !== -1;
  if (!isMulti) return; // let the browser handle a normal single-value paste
  ev.preventDefault();
  syncProductsDraft();
  const cols = ['model', 'name', 'price', 'image', 'stock'];
  lines.forEach((line, r) => {
    const cells = line.split('\t');
    const targetRow = rowIndex + r;
    while (state.products.length <= targetRow) state.products.push({ model: '', name: '', price: 0, image: '', stock: 0 });
    cells.forEach((val, c) => {
      const col = cols[colIndex + c];
      if (!col) return;
      if (col === 'price' || col === 'stock') state.products[targetRow][col] = Number(String(val).replace(/[^0-9.\-]/g, '')) || 0;
      else state.products[targetRow][col] = String(val).trim();
    });
  });
  render();
  showToast(`Pasted ${lines.length} row${lines.length === 1 ? '' : 's'}`);
}
function openProductsModal() {
  if (!state.editMode) return;
  state.ui.productsModalOpen = true;
  render();
}
function closeProductsModal() { state.ui.productsModalOpen = false; render(); }
function syncProductsDraft() {
  state.products = state.products.map((p, i) => {
    const modelEl = document.getElementById(`p-model-${i}`);
    const nameEl = document.getElementById(`p-name-${i}`);
    const priceEl = document.getElementById(`p-price-${i}`);
    const stockEl = document.getElementById(`p-stock-${i}`);
    return {
      model: modelEl ? modelEl.value.trim() : p.model,
      name: nameEl ? nameEl.value : p.name,
      price: priceEl ? (parseFloat(priceEl.value) || 0) : p.price,
      stock: stockEl ? (parseFloat(stockEl.value) || 0) : (Number(p.stock) || 0),
      image: p.image || ''
    };
  });
}
function addProductRow() {
  syncProductsDraft();
  state.products.push({ model: '', name: '', price: 0, image: '', stock: 0 });
  render();
}
function removeProductRow(i) {

function triggerProductImageUpload(i) {
  syncProductsDraft();
  productImageRowIndex = i;
  document.getElementById('product-image-input').click();
}
function handleProductImageUpload(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file || productImageRowIndex == null) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    if (state.products[productImageRowIndex]) state.products[productImageRowIndex].image = e.target.result;
    productImageRowIndex = null;
    render();
  };
  reader.readAsDataURL(file);
}
function handleProductsUpload(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      syncProductsDraft();
      let added = 0, updated = 0;
      rows.forEach(r => {
        const model = String(pick(r, ['Model', 'Model Number', 'Model No']) || '').trim();
        if (!model) return;
        const name = pick(r, ['Name', 'Product Name']);
        const priceRaw = pick(r, ['Price', 'Unit Price']);
        const price = Number(priceRaw) || 0;
        const image = pick(r, ['Image', 'Image URL', 'Photo', 'Photo URL']);
        const stockRaw = pick(r, ['Stock', 'Stock Qty', 'Quantity', 'Qty']);
        const hasStock = stockRaw !== undefined && stockRaw !== '';
        const stock = Number(stockRaw) || 0;
        const existing = state.products.find(p => p.model === model);
        if (existing) {
          if (name) existing.name = name;
          if (price) existing.price = price;
          if (image) existing.image = image;
          if (hasStock) existing.stock = stock;
          updated++;
        } else {
          state.products.push({ model, name: name || '', price, image: image || '', stock: hasStock ? stock : 0 });
          added++;
        }
      });
      if (added === 0 && updated === 0) { showToast('No matching rows found in that sheet'); return; }
      const ok = await persistProducts();
      render();
      if (ok) showToast(`Products: ${added} added, ${updated} updated`);
    } catch (err) {
      showToast('Could not read that file');
    }
  };
  reader.readAsArrayBuffer(file);
  ev.target.value = '';
}

/* ===================== Auth gate (required for everyone: viewers + data entry) =====================
   No public self sign-up: an editor creates each login (see "Add user" below) and hands the
   number/email + password to that person. Viewers/data-entry just sign in with it. */
window.currentSession = null;

async function refreshSession() {
  try {
    var res = await window.sbClient.auth.getSession();
    window.currentSession = (res.data && res.data.session) ? res.data.session : null;
  } catch (e) { window.currentSession = null; }
  return window.currentSession;
}

/* Normalize a locally-entered number (e.g. 01xxxxxxxxx) into E.164 (+8801xxxxxxxxx).
   If the user already typed a country code (+ or 880…) it's kept as-is. */
function toE164(raw) {
  var v = (raw || '').replace(/[\s\-()]/g, '');
  if (!v) return '';
  if (v.charAt(0) === '+') return v;
  if (v.indexOf('880') === 0) return '+' + v;
  if (v.charAt(0) === '0') return '+880' + v.slice(1);
  return '+' + v;
}
function isEmailLike(v) { return v.indexOf('@') !== -1; }

async function handleAuthSubmit() {
  var idRaw = document.getElementById('authId').value.trim();
  var password = document.getElementById('authPassword').value;
  var errEl = document.getElementById('authError');
  if (errEl) errEl.textContent = '';
  if (!idRaw || !password) { if (errEl) errEl.textContent = 'Please enter your number/email and password.'; return; }
  var btn = document.getElementById('authSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    var credentials = isEmailLike(idRaw) ? { email: idRaw, password: password } : { phone: toE164(idRaw), password: password };
    var result = await window.sbClient.auth.signInWithPassword(credentials);
    if (result.error) {
      if (errEl) errEl.textContent = result.error.message;
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      return;
    }
    window.currentSession = result.data.session;
    render();
    showToast('Signed in');
  } catch (e) {
    if (errEl) errEl.textContent = 'Something went wrong. Please try again.';
    if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
  }
}

/* ===================== Add user (editor-only: creates a login for someone else) =====================
   Uses Supabase signUp() to create the account, then immediately restores the editor's own

async function openAddUserModal() {

async function createUserLogin() {
  var idRaw = document.getElementById('newUserId').value.trim();
  var password = document.getElementById('newUserPassword').value;
  var errEl = document.getElementById('newUserError');
  if (errEl) errEl.textContent = '';
  if (!idRaw || !password) { if (errEl) errEl.textContent = 'Please enter a number/email and password.'; return; }
  if (password.length < 6) { if (errEl) errEl.textContent = 'Password should be at least 6 characters.'; return; }
  var btn = document.getElementById('newUserSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }

  // Keep the editor's own tokens so we can restore this session afterwards.
  var editorAccessToken = window.currentSession ? window.currentSession.access_token : null;
  var editorRefreshToken = window.currentSession ? window.currentSession.refresh_token : null;

  try {
    var credentials = isEmailLike(idRaw) ? { email: idRaw, password: password } : { phone: toE164(idRaw), password: password };
    var result = await window.sbClient.auth.signUp(credentials);
    if (result.error) {
      if (errEl) errEl.textContent = result.error.message;
      if (btn) { btn.disabled = false; btn.textContent = 'Create login'; }
      return;
    }
    // Restore the editor's session (signUp may have switched the client to the new user).
    if (editorAccessToken && editorRefreshToken) {
      try { await window.sbClient.auth.setSession({ access_token: editorAccessToken, refresh_token: editorRefreshToken }); } catch (e) {}
    }
    await refreshSession();
    state.ui.addUserOpen = false;
    render();
    showToast('Login created — share the number/email and password with them');
  } catch (e) {
    if (errEl) errEl.textContent = 'Something went wrong. Please try again.';
    if (btn) { btn.disabled = false; btn.textContent = 'Create login'; }
  }
}

function investmentSummaryForProfile(name) {

  var rows = (state.entries.ie || []).filter(function (e) {

  return { total: total, rows: rows };
}

let dueListCache = [];
function customerDueList() {
  const map = {};
  (state.entries.sales || []).forEach(function (e) {
    const due = Number(e.due) || 0;
    if (due <= 0.009) return;
    const name = (e.customer || '').trim() || 'Unknown';
    if (!map[name]) map[name] = { name: name, mobile: e.mobile || '', total: 0, orders: [] };
    map[name].total += due;
    if (!map[name].mobile && e.mobile) map[name].mobile = e.mobile;
    map[name].orders.push(e);
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.total - a.total; });
}
function openDueModal() { state.ui.dueModalOpen = true; state.ui.dueDetailCustomer = null; render(); }
function closeDueModal() { state.ui.dueModalOpen = false; state.ui.dueDetailCustomer = null; render(); }
function openDueDetailByIndex(i) {
  const c = dueListCache[i];
  if (!c) return;
  state.ui.dueDetailCustomer = c.name;
  render();
}
function backToDueList() { state.ui.dueDetailCustomer = null; render(); }
async function recordDuePayment(orderId) {
  const inputEl = document.getElementById('due-pay-' + orderId);
  const errEl = document.getElementById('due-pay-err-' + orderId);
  if (errEl) errEl.textContent = '';
  const entry = state.entries.sales.find(function (e) { return e.id === orderId; });
  if (!entry) return;
  const currentDue = Number(entry.due) || 0;
  const amt = parseFloat(inputEl ? inputEl.value : '');
  if (!amt || amt <= 0) { if (errEl) errEl.textContent = 'সঠিক পরিমাণ লিখুন'; return; }
  if (amt > currentDue + 0.01) { if (errEl) errEl.textContent = 'বকেয়ার চেয়ে বেশি হতে পারবে না'; return; }
  const prevAdvance = Number(entry.advance) || 0;
  entry.advance = prevAdvance + amt;
  entry.due = Math.max(0, currentDue - amt);
  const ok = await persist('sales');
  if (!ok) { entry.advance = prevAdvance; entry.due = currentDue; render(); return; }
  render();
  showToast('পেমেন্ট রেকর্ড হয়েছে');
}

function accountBalance(accountId) {
  const acc = state.accounts.find(function (a) { return a.id === accountId; });
  if (!acc) return 0;
  let bal = Number(acc.openingBalance) || 0;
  state.accountTxns.forEach(function (t) {
    if (t.accountId !== accountId) return;
    bal += (t.type === 'in' ? (Number(t.amount) || 0) : -(Number(t.amount) || 0));

  return bal;
}

function assetBookValue(a) {
  const cost = Number(a.cost) || 0;
  const life = Number(a.usefulLifeYears) || 0;
  if (!life || !a.purchaseDate) return cost;
  const purchased = new Date(a.purchaseDate);
  const now = new Date();
  const yearsElapsed = Math.max(0, (now - purchased) / (365.25 * 24 * 3600 * 1000));
  const annualDep = cost / life;
  const depSoFar = Math.min(cost, annualDep * yearsElapsed);
  return Math.max(0, cost - depSoFar);
}
